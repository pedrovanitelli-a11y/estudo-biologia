reparação final para a divisão.", "M é a divisão; o DNA já precisa estar duplicado.", "G0 é o estado de células que não se dividem."]}, {"id": "b51", "c": "ciclo", "d": 1, "q": "A afirmação 'a interfase é uma fase de repouso da célula' está:", "a": ["errada, pois a célula cresce e duplica o DNA", "certa, pois a célula não realiza metabolismo", "certa, pois ocupa só 10% do tempo do ciclo", "errada, pois é nela que o núcleo se divide", "certa, pois nela os cromossomos se condensam"], "k": 0, "e": "Na interfase a célula está muito ativa: cresce, produz proteínas e organelas e DUPLICA O DNA (fase S). Ela só não está se dividindo.", "w": [null, "A célula tem intensa atividade metabólica na interfase.", "A interfase ocupa cerca de 90% do ciclo.", "O núcleo se divide na mitose (fase M), não na interfase.", "A condensação dos cromossomos ocorre na divisão."]}, {"id": "b52", "c": "ciclo", "d": 3, "q": "Uma célula 2n = 8 está em G2. Considerando que em G1 a quantidade de DNA é 2C, ela apresenta:", "a": ["8 cromossomos e 4C", "16 cromossomos e 4C", "8 cromossomos e 2C", "4 cromossomos e 2C", "16 cromossomos e 2C"], "k": 0, "e": "Após a fase S a quantidade de DNA dobra (2C → 4C), mas o número de cromossomos continua 8: cada um apenas passou a ter 2 cromátides.", "w": [null, "Duplicar o DNA não dobra o número de cromossomos.", "Em G2 o DNA já foi duplicado: 4C.", "4 cromossomos seria uma célula haploide.", "O número de cromossomos não dobra, e o DNA está em 4C."]}, {"id": "b53", "c": "ciclo", "d": 2, "q": "Neurônios maduros raramente se dividem. No ciclo celular, essas células permanecem em:", "a": ["G0", "G1", "S", "G2", "M"], "k": 0, "e": "Células que raramente ou nunca se dividem saem do ciclo e ficam em G0, realizando suas funções normais.", "w": [null, "Em G1 a célula ainda pode decidir se dividir.", "Em S a célula está duplicando o DNA para se dividir.", "G2 é a preparação final para a divisão.", "M é a própria fase de divisão."]}, {"id": "b54", "c": "ciclo", "d": 2, "q": "No ponto de verificação G1 (ponto de restrição), a célula avalia, entre outros fatores:", "a": ["tamanho, nutrientes e danos no DNA", "alinhamento dos cromossomos no fuso", "ligação das cromátides às fibras", "quantidade de nucléolos formados", "número de lisossomos secundários"], "k": 0, "e": "No ponto G1 são analisados o tamanho da célula, os nutrientes, os fatores de crescimento e possíveis danos no DNA. Se não houver sinal para seguir, a célula vai para G0.", "w": [null, "O alinhamento no fuso é verificado no ponto M.", "A ligação das cromátides às fibras é verificada no ponto M.", "Nucléolos não são critério do ponto G1.", "Lisossomos não são critério dos pontos de verificação."]}, {"id": "b55", "c": "ciclo", "d": 2, "q": "A divisão é pausada porque uma cromátide-irmã não está presa corretamente às fibras do fuso. Esse controle ocorre no ponto de verificação:", "a": ["M", "G1", "G2", "S", "G0"], "k": 0, "e": "No ponto de verificação M a divisão é paralisada se alguma cromátide-irmã não estiver ligada corretamente às fibras do fuso.", "w": [null, "O ponto G1 avalia tamanho, nutrientes e danos no DNA.", "O ponto G2 verifica se o DNA foi duplicado corretamente.", "A apostila não descreve um ponto de verificação na fase S.", "G0 não é ponto de verificação; é um estado fora do ciclo."]}, {"id": "b56", "c": "ciclo", "d": 1, "q": "O câncer é considerado uma doença do ciclo celular porque:", "a": ["as células ignoram os pontos de verificação", "as células param de se dividir para sempre", "o DNA deixa de ser duplicado na interfase", "as células entram em G0 e nunca mais saem", "as mitocôndrias deixam de produzir o ATP"], "k": 0, "e": "Alterações genéticas fazem as células ignorarem os pontos de verificação: elas se dividem sem parar, formam tumores e podem originar metástases.", "w": [null, "No câncer as células se dividem demais, não param.", "As células cancerosas continuam duplicando o DNA.", "Ficar em G0 é o oposto da proliferação do câncer.", "O problema central é o controle da divisão, não o ATP."]}, {"id": "b57", "c": "ciclo", "d": 2, "q": "Células somáticas humanas cultivadas param de se dividir após cerca de 40 a 60 divisões. Esse limite está relacionado:", "a": ["ao encurtamento gradual dos telômeros", "à perda do nucléolo durante a interfase", "ao excesso de ciclinas no citosol celular", "à falta de centríolos nas células velhas", "ao aumento do tamanho dos cromossomos"], "k": 0, "e": "É o LIMITE DE HAYFLICK: os telômeros encurtam a cada divisão; muito curtos, uma nova divisão poderia danificar o DNA, e a célula entra em senescência replicativa.", "w": [null, "O nucléolo não se perde na interfase.", "A apostila liga o limite aos telômeros, não às ciclinas.", "Células animais têm centríolos.", "Os cromossomos não aumentam de tamanho com as divisões."]}, {"id": "b58", "c": "ciclo", "d": 2, "q": "No ponto de verificação G2, uma célula com mutação no DNA que não pode ser reparada tende a:", "a": ["entrar em apoptose", "seguir para a mitose", "voltar para a fase S", "virar célula haploide", "duplicar o DNA de novo"], "k": 0, "e": "Se o DNA não foi duplicado corretamente ou tem dano irreparável, a divisão é interrompida e a célula pode entrar em APOPTOSE (morte programada).", "w": [null, "Seguir para a mitose espalharia o erro para as células-filhas.", "A apostila não cita retorno à fase S como solução.", "Mutação não torna a célula haploide.", "Duplicar de novo não corrige um dano irreparável."]}, {"id": "b59", "c": "ciclo", "d": 2, "q": "Na preparação para a divisão em células vegetais, a organização do fuso mitótico acontece:", "a": ["sem centríolos, comandada pelo centrossomo", "com centríolos, comandada pelo nucléolo", "sem centrossomo, comandada pelos plastos", "com centríolos, como nas células animais", "sem microtúbulos, só por meio da actina"], "k": 0, "e": "Células vegetais não têm centríolos, mas o CENTROSSOMO comanda a organização dos microtúbulos (tubulinas) do fuso.", "w": [null, "Células vegetais não têm centríolos, e o nucléolo não forma o fuso.", "Há centrossomo; plastos não organizam o fuso.", "Centríolos estão ausentes nas vegetais.", "O fuso é formado por microtúbulos."]}, {"id": "b60", "c": "mit", "d": 1, "q": "Uma célula haploide (n) de uma alga passa por mitose. As células-filhas serão:", "a": ["haploides e geneticamente iguais à mãe", "diploides e geneticamente iguais à mãe", "haploides e geneticamente diferentes", "diploides e geneticamente diferentes", "tetraploides e iguais à célula-mãe"], "k": 0, "e": "A mitose não muda o número de cromossomos: n → n e 2n → 2n. As duas células-filhas são geneticamente iguais à mãe.", "w": [null, "A mitose não dobra o número de cromossomos.", "Na mitose as filhas são iguais à mãe.", "Mitose não dobra o número, e as filhas são iguais.", "A mitose mantém a ploidia da célula-mãe."]}, {"id": "b61", "c": "mit", "d": 1, "q": "A sequência correta das fases da mitose é:", "a": ["prófase, prometáfase, metáfase, anáfase e telófase", "prófase, metáfase, prometáfase, anáfase e telófase", "prometáfase, prófase, metáfase, telófase e anáfase", "prófase, prometáfase, anáfase, metáfase e telófase", "metáfase, prófase, prometáfase, anáfase e telófase"], "k": 0, "e": "Prófase → prometáfase → metáfase → anáfase → telófase (+ citocinese). Frase: 'PROMETA A ANA TELEFONAR'.", "w": [null, "A prometáfase vem antes da metáfase.", "A prófase é a primeira fase, e a anáfase vem antes da telófase.", "A metáfase vem antes da anáfase.", "A mitose começa pela prófase, não pela metáfase."]}, {"id": "b62", "c": "mit", "d": 2, "q": "A fase em que o envelope nuclear se fragmenta e os cinetócoros se prendem aos microtúbulos, formando as fibras cromossômicas, é a:", "a": ["prometáfase", "prófase", "metáfase", "anáfase", "telófase"], "k": 0, "e": "Na PROMETÁFASE o envelope nuclear e o nucléolo se fragmentam e os cinetócoros se encaixam nos microtúbulos (fibras cromossômicas).", "w": [null, "Na prófase o envelope só COMEÇA a ser desmontado.", "Na metáfase os cromossomos já estão presos e alinhados.", "Na anáfase as cromátides se separam.", "Na telófase o envelope se refaz."]}, {"id": "b63", "c": "mit", "d": 1, "q": "Na metáfase da mitose, os cromossomos:", "a": ["alinham-se na placa equatorial, bem condensados", "separam-se e vão para polos opostos da célula", "descondensam-se e formam dois novos núcleos", "pareiam com seus homólogos e trocam pedaços", "duplicam seu DNA e se tornam bem condensados"], "k": 0, "e": "Na METÁFASE os cromossomos estão no grau máximo de condensação e alinhados na região equatorial (placa metafásica).", "w": [null, "A separação para os polos é na anáfase.", "Descondensação e novos núcleos ocorrem na telófase.", "Pareamento e crossing-over são da prófase I da meiose.", "A duplicação do DNA ocorre na fase S da interfase."]}, {"id": "b64", "c": "mit", "d": 1, "q": "O evento que marca o início da anáfase da mitose é:", "a": ["a separação das cromátides-irmãs no centrômero", "a separação dos cromossomos homólogos pareados", "a condensação máxima dos cromossomos na placa", "o reaparecimento do nucléolo nos novos núcleos", "a fragmentação do envelope nuclear da célula"], "k": 0, "e": "A anáfase começa quando o CENTRÔMERO SE SEPARA: as cromátides-irmãs viram cromossomos-filhos e vão para polos opostos.", "w": [null, "Separar homólogos ocorre na anáfase I da meiose.", "Condensação máxima é característica da metáfase.", "O nucléolo reaparece na telófase.", "O envelope se fragmenta na prometáfase."]}, {"id": "b65", "c": "mit", "d": 2, "q": "A colchicina, usada para preparar cariótipos, desagrega os microtúbulos. Por isso, a divisão celular fica paralisada na:", "a": ["metáfase", "anáfase", "telófase", "fase S", "prófase"], "k": 0, "e": "Sem microtúbulos funcionais, os cromossomos não são puxados aos polos: a divisão para na METÁFASE.", "w": [null, "Para haver anáfase seria preciso o fuso puxar os cromossomos.", "A telófase vem depois da anáfase, que não ocorre.", "A fase S é da interfase e não depende do fuso.", "A célula avança até a metáfase antes de parar."]}, {"id": "b66", "c": "mit", "d": 3, "q": "Uma célula com 2n = 6 está na metáfase da mitose. Quantos cromossomos e cromátides ela possui?", "a": ["6 cromossomos e 12 cromátides", "12 cromossomos e 12 cromátides", "6 cromossomos e 6 cromátides", "3 cromossomos e 6 cromátides", "12 cromossomos e 24 cromátides"], "k": 0, "e": "Na metáfase há 6 cromossomos, cada um DUPLICADO (2 cromátides): 6 × 2 = 12 cromátides.", "w": [null, "12 cromossomos só aparecem na anáfase, quando as cromátides se separam.", "Na metáfase os cromossomos estão duplicados.", "3 cromossomos seria uma célula haploide.", "O número de cromossomos não dobra na metáfase."]}, {"id": "b67", "c": "mit", "d": 2, "q": "A citocinese de uma célula vegetal é diferente da de uma célula animal porque, na vegetal:", "a": ["é centrífuga e forma a placa celular", "é centrípeta e forma um anel contrátil", "é centrífuga e forma um anel contrátil", "é centrípeta e forma a placa celular", "não ocorre, ficando dois núcleos juntos"], "k": 0, "e": "Na vegetal a citocinese é CENTRÍFUGA: vesículas do complexo golgiense formam a PLACA CELULAR, que origina a lamela média. A parede rígida impede o estrangulamento.", "w": [null, "Centrípeta com anel contrátil é a citocinese ANIMAL.", "O anel contrátil (actina e miosina) é animal.", "A placa celular cresce do centro para fora (centrífuga).", "A citocinese ocorre normalmente nas células vegetais."]}, {"id": "b68", "c": "mit", "d": 2, "q": "Por não ter centríolos nem ásteres, a mitose das células vegetais é classificada como:", "a": ["acêntrica e anastral", "cêntrica e astral", "acêntrica e astral", "cêntrica e anastral", "polar e equacional"], "k": 0, "e": "Sem centríolos → ACÊNTRICA; sem ásteres → ANASTRAL. A mitose animal é cêntrica e astral.", "w": [null, "Cêntrica e astral é a mitose animal.", "Sem áster, a mitose é anastral.", "Sem centríolos, a mitose é acêntrica.", "Esses termos não classificam a mitose quanto a centríolos e ásteres."]}, {"id": "b69", "c": "mit", "d": 2, "q": "Quantas divisões mitóticas sucessivas são necessárias para que uma única célula origine 32 células?", "a": ["5", "4", "6", "16", "32"], "k": 0, "e": "Cada mitose dobra o número de células: 1 → 2 → 4 → 8 → 16 → 32. São 5 divisões (2⁵ = 32).", "w": [null, "4 divisões formam 16 células.", "6 divisões formam 64 células.", "16 é o número de células após 4 divisões.", "32 é o número de células, não de divisões."]}, {"id": "b70", "c": "mei", "d": 1, "q": "A meiose I é chamada de divisão reducional porque nela ocorre:", "a": ["a separação dos cromossomos homólogos", "a separação das cromátides-irmãs unidas", "a duplicação do DNA durante a intercinese", "o crossing-over entre cromátides-irmãs", "a formação de quatro células diploides"], "k": 0, "e": "Na anáfase I os HOMÓLOGOS se separam (disjunção meiótica): cada célula fica com um conjunto haploide, reduzindo o número à metade.", "w": [null, "As cromátides-irmãs se separam na meiose II (equacional).", "Na intercinese não há duplicação do DNA.", "O crossing-over ocorre entre cromátides NÃO irmãs.", "A meiose forma células haploides, não diploides."]}, {"id": "b71", "c": "mei", "d": 2, "q": "O crossing-over ocorre na subfase ______ da prófase I e consiste na troca de pedaços entre:", "a": ["paquíteno; cromátides não irmãs de homólogos", "zigóteno; cromátides-irmãs de um cromossomo", "paquíteno; cromátides-irmãs de um cromossomo", "diplóteno; cromossomos que não são homólogos", "leptóteno; cromátides não irmãs de homólogos"], "k": 0, "e": "No PAQUÍTENO, cromátides NÃO IRMÃS de um par de homólogos se quebram e trocam pedaços (permuta), gerando novas combinações de genes.", "w": [null, "No zigóteno ocorre a sinapse, e a troca é entre cromátides não irmãs.", "Trocas entre cromátides-irmãs não criariam novas combinações.", "O diplóteno mostra os quiasmas; a troca ocorre entre homólogos.", "No leptóteno os cromossomos só começam a se condensar."]}, {"id": "b72", "c": "mei", "d": 2, "q": "No diplóteno, os homólogos começam a se separar, mas permanecem unidos em pontos em forma de X. Esses pontos são:", "a": ["os quiasmas", "os centrômeros", "os telômeros", "os cinetócoros", "os nucléolos"], "k": 0, "e": "QUIASMAS são os pontos onde houve crossing-over, visíveis no diplóteno como um 'X'.", "w": [null, "Centrômero une as cromátides-irmãs de um mesmo cromossomo.", "Telômeros são as pontas dos cromossomos.", "Cinetócoros prendem o cromossomo às fibras do fuso.", "Nucléolo produz RNA ribossômico."]}, {"id": "b73", "c": "mei", "d": 2, "q": "A subfase da prófase I em que os homólogos se emparelham gene a gene (sinapse), formando o complexo sinaptonêmico, é o:", "a": ["zigóteno", "leptóteno", "paquíteno", "diplóteno", "diacinese"], "k": 0, "e": "No ZIGÓTENO cada cromossomo se emparelha ao homólogo (sinapse) e começa a se formar o complexo sinaptonêmico ('zíper').", "w": [null, "No leptóteno os cromossomos só começam a condensar.", "No paquíteno ocorre o crossing-over.", "No diplóteno o 'zíper' se desfaz.", "Na diacinese os quiasmas se desfazem e a prófase I termina."]}, {"id": "b74", "c": "mei", "d": 2, "q": "Entre a meiose I e a meiose II ocorre a intercinese, cuja característica principal é:", "a": ["não ocorrer duplicação do DNA", "ocorrer nova duplicação do DNA", "ocorrer o crossing-over de novo", "formar quatro células haploides", "separar os cromossomos homólogos"], "k": 0, "e": "A intercinese é um curto repouso entre as divisões SEM replicação do DNA; os cromossomos já estão duplicados.", "w": [null, "Não há nova fase S entre as divisões.", "O crossing-over ocorre na prófase I.", "As quatro células surgem ao final da meiose II.", "Os homólogos se separam na anáfase I."]}, {"id": "b75", "c": "mei", "d": 1, "q": "Ao final da telófase I, cada célula formada é:", "a": ["haploide, com cromossomos ainda duplicados", "diploide, com cromossomos ainda duplicados", "haploide, com cromossomos simples e iguais", "diploide, com cromossomos simples e iguais", "triploide, com cromossomos ainda duplicados"], "k": 0, "e": "Após a meiose I cada célula tem um conjunto HAPLOIDE, mas cada cromossomo ainda tem 2 cromátides (DUPLICADO). Só após a meiose II eles ficam simples.", "w": [null, "Os homólogos já se separaram: a célula é haploide.", "Os cromossomos ainda estão duplicados após a telófase I.", "A célula já é haploide, e os cromossomos ainda estão duplicados.", "A meiose não forma células triploides."]}, {"id": "b76", "c": "mei", "d": 2, "q": "Na metáfase I, a posição de cada par de homólogos na placa é aleatória. Isso contribui para a variabilidade genética por meio da:", "a": ["segregação independente", "replicação semiconservativa", "não disjunção cromossômica", "duplicação dos centríolos", "condensação da cromatina"], "k": 0, "e": "O arranjo ao acaso de cada par na metáfase I leva à SEGREGAÇÃO INDEPENDENTE dos homólogos, criando combinações diferentes nos gametas.", "w": [null, "Replicação semiconservativa é o modo de copiar o DNA.", "Não disjunção é uma falha, não a fonte normal de variabilidade.", "Duplicar centríolos não muda combinações genéticas.", "Condensação não altera a combinação de cromossomos."]}, {"id": "b77", "c": "mei", "d": 3, "q": "Uma célula tem quantidade de DNA igual a 2X em G1. Ao final da meiose II, cada célula-filha terá:", "a": ["X", "2X", "4X", "X/2", "8X"], "k": 0, "e": "G1 = 2X → fase S: 4X → após a telófase I cada célula tem 2X → após a telófase II cada uma tem X.", "w": [null, "2X é o valor ao final da meiose I.", "4X é o valor após a fase S.", "Não há redução abaixo de X.", "Não há duplicação adicional que leve a 8X."]}, {"id": "b78", "c": "mei", "d": 2, "q": "Se ocorrer não disjunção de um par de homólogos na anáfase I, os gametas formados serão:", "a": ["todos alterados: uma metade n+1 e outra n−1", "metade normais e metade com cromossomo extra", "todos normais, pois a meiose II corrige o erro", "todos com n+1, pois o par vai para um só polo", "metade normais e a metade sem um cromossomo"], "k": 0, "e": "Se os homólogos não se separam na anáfase I, uma célula fica com o par e a outra sem ele: TODOS os gametas ficam alterados (metade n+1, metade n−1).", "w": [null, "Metade normal ocorre quando a falha é na anáfase II.", "A meiose II não corrige o erro.", "A célula que não recebe o par gera gametas n−1.", "Metade normal é resultado de falha na anáfase II."]}, {"id": "b79", "c": "mei", "d": 2, "q": "A síndrome de Klinefelter, que afeta pessoas de sexo biológico masculino e resulta de não disjunção, corresponde ao cariótipo:", "a": ["47,XXY", "45,X0", "47,XX,+21", "47,XYY", "47,XXX"], "k": 0, "e": "KLINEFELTER = 47,XXY (sexo masculino com um X a mais). Atenção: no caderno estava anotado 47,XXX, mas a apostila traz 47,XXY.", "w": [null, "45,X0 é a síndrome de Turner (sexo feminino com um X a menos).", "47,XX,+21 é a síndrome de Down (trissomia do 21).", "47,XYY é outra alteração dos cromossomos sexuais, não a Klinefelter.", "47,XXX é uma trissomia do X em pessoas do sexo feminino, não a Klinefelter."]}], "cards": [["Lisossomo", "Digestão celular com hidrolases ácidas (pH ≈ 5). Formado pelo Golgi."], ["Heterofagia", "Digere material de fora: fagossomo → vacúolo digestivo → corpo residual."], ["Autofagia", "Digere e recicla partes da própria célula."], ["Apoptose", "Morte celular programada, sem inflamação (ex.: dedos do embrião)."], ["Peroxissomo", "Oxidases + catalase: 2 H₂O₂ → 2 H₂O + O₂."], ["Glioxissomo", "Em sementes: transforma gordura em açúcar (ciclo do glioxilato)."], ["Catabolismo × anabolismo", "Quebrar e liberar energia × construir e gastar energia."], ["ATP", "Adenina + ribose + 3 fosfatos. ATP → ADP + Pi libera energia."], ["NAD⁺ → NADH", "Recebe elétrons e H: sofre redução. Transportador."], ["Glicólise", "Citosol, sem O₂, sem CO₂. Saldo: 2 ATP, 2 NADH, 2 piruvatos."], ["Ciclo de Krebs", "Na matriz da mitocôndria; libera CO₂ e produz NADH e FADH₂."], ["Cadeia respiratória", "Nas cristas; O₂ é o aceptor final e vira água; gera a maior parte do ATP."], ["Fermentação alcoólica", "Leveduras: etanol + CO₂ (pão, bebidas)."], ["Fermentação lática", "Músculo e lactobacilos: ácido lático, sem CO₂ (iogurte)."], ["Por que fermentar?", "Para regenerar o NAD⁺ e manter a glicólise."], ["Endossimbiose", "Mitocôndria veio de bactéria; cloroplasto de cianobactéria. Têm DNA próprio."], ["Origem do O₂ da fotossíntese", "Vem da água (fotólise), não do CO₂."], ["Fase fotoquímica", "Tilacoides: fotólise, O₂, ATP e NADPH."], ["Ciclo de Calvin", "Estroma: usa ATP e NADPH; RuBisCO fixa CO₂; forma glicose."], ["Folha verde", "A clorofila absorve azul e vermelho e reflete o verde."], ["Nucléolo", "Produz RNA ribossômico."], ["Eucromatina × heterocromatina", "Frouxa e ativa × condensada e inativa."], ["Telômeros", "Pontas dos cromossomos; encurtam a cada divisão. Telomerase refaz."], ["Acrocêntrico", "Centrômero perto de uma ponta (um braço bem curto)."], ["Fase S", "Duplica o DNA e os centríolos (2C → 4C)."], ["G0", "Célula que não se divide mais (ex.: neurônio)."], ["Ordem da mitose", "Prófase, prometáfase, metáfase, anáfase, telófase (PMAT)."], ["Anáfase da mitose", "Separação das cromátides-irmãs."], ["Colchicina", "Desmonta o fuso: para a divisão na metáfase."], ["Mitose vegetal", "Acêntrica e anastral; citocinese centrífuga."], ["Meiose I", "Reducional: separa homólogos (2n → n)."], ["Paquíteno", "Crossing-over."], ["Zigóteno", "Sinapse: pareamento dos homólogos."], ["Intercinese", "Entre meiose I e II, sem duplicar DNA."], ["Down / Klinefelter / Turner", "47,+21 / 47,XXY / 45,X0 — não disjunção."]], "diss": [], "videos": [{"c": "org", "t": "Lisossomos e peroxissomos", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=lisossomos+peroxissomos+aula+biologia"}, {"c": "bio", "t": "ATP e glicólise", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=glicólise+ATP+NADH+aula+biologia+ensino+médio"}, {"c": "resp", "t": "Respiração celular completa", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=respiração+celular+glicólise+krebs+cadeia+respiratória+aula"}, {"c": "resp", "t": "Fermentação alcoólica e lática", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=fermentação+alcoólica+e+lática+aula"}, {"c": "foto", "t": "Fotossíntese: fase clara e ciclo de Calvin", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=fotossíntese+fase+clara+ciclo+de+calvin+aula"}, {"c": "nuc", "t": "Núcleo, cromatina e cromossomos", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=núcleo+celular+cromatina+cromossomos+aula"}, {"c": "ciclo", "t": "Ciclo celular e pontos de checagem", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=ciclo+celular+interfase+pontos+de+checagem+aula"}, {"c": "mit", "t": "Mitose passo a passo", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=mitose+fases+aula+biologia"}, {"c": "mei", "t": "Meiose e crossing-over", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=meiose+prófase+I+crossing+over+aula"}, {"c": "mei", "t": "Mitose × meiose (comparação)", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=diferença+mitose+e+meiose+resumo"}]};

 <div class="row"><a class="btn" href="#k--resumo">Começar pelo resumo</a><a class="btn g" href="#k--simulado">Fazer simulado</a></div>
 ${best?`<p class="note" style="margin-top:12px">Seu melhor simulado: <b>${best}%</b></p>`:''}</div><div class="art">${HERO_ART}</div></section>
 <h2>Plano para estudar hoje</h2><div class="plan">${D.plan.map((p,i)=>`<label class="${plan.includes(i)?'done':''}"><input type="checkbox" data-i="${i}" ${plan.includes(i)?'checked':''}><span>${p}</span></label>`).join('')}</div>
 <h2>${D.chapWord}</h2><div class="grid">${D.chapters.map(c=>`<a class="tile" href="#k--cap-${c.id}"><div class="n">${c.n}</div><b>${c.title}</b><span>${c.hint}</span></a>`).join('')}</div>`;
 app.querySelectorAll('.plan input').forEach(i=>i.onchange=()=>{let p=S.get('plan',[]);const n=+i.dataset.i;p=i.checked?[...new Set([...p,n])]:p.filter(x=>x!==n);S.set('plan',p);i.parentNode.classList.toggle('done',i.checked)});
}
function chapter(id){
 const i=Math.max(0,D.chapters.findIndex(c=>c.id===id));const c=D.chapters[i];const ess=S.get('ess',false);
 app.innerHTML=`<div class="chipsnav">${D.chapters.map(x=>`<a href="#k--cap-${x.id}" class="${x.id===c.id?'on':''}">${x.n} · ${x.short}</a>`).join('')}</div>
 <article class="chap ${ess?'essential':''}" id="chap"><div class="chap-h"><div class="num">${c.n}</div><div><div class="kick">${D.chapWordOne} ${c.n}</div><h2 style="margin:0">${c.title}</h2></div></div>
 <button class="toggle" id="tg"><i></i>Só o essencial</button>
 <div class="content" style="margin-top:14px">${c.html}</div>
 <div class="pn">${i>0?`<a class="btn g" href="#k--cap-${D.chapters[i-1].id}">← ${D.chapters[i-1].short}</a>`:'<span></span>'}${i<D.chapters.length-1?`<a class="btn" href="#k--cap-${D.chapters[i+1].id}">${D.chapters[i+1].short} →</a>`:`<a class="btn" href="#k--simulado">Ir para o simulado →</a>`}</div></article>`;
 $('#tg').onclick=()=>{const v=!S.get('ess',false);S.set('ess',v);$('#chap').classList.toggle('essential',v)};
 window.scrollTo(0,0);
}
function extra(id){const x=D.extras.find(e=>e.id===id);app.innerHTML=`<article class="chap"><h2>${x.title}</h2><div class="content">${x.html}</div></article>`;window.scrollTo(0,0)}

// ---------- simulado
let Q=null;
function interleave(arr){const g={1:[],2:[],3:[]};arr.sort(()=>Math.random()-.5).forEach(q=>g[q.d].push(q));const pat=[1,2,3,2,1,3,2,3,1,2];const out=[];let k=0;while(out.length<arr.length){const d=pat[k++%pat.length];if(g[d].length)out.push(g[d].shift());else{const o=[1,2,3].find(x=>g[x].length);if(o)out.push(g[o].shift())}}return out}
function setup(){
 const sel=S.get('sel',D.chapters.map(c=>c.id));let n=S.get('n',20);
 app.innerHTML=`<div class="card setup"><div class="kick">Simulado</div><h2>Treine com correção na hora</h2><p class="note">${D.quiz.length} questões ao todo. A ordem mistura fácil, média e difícil. Cada resposta mostra a explicação.</p>
 <h3 style="font-family:var(--hf);margin:16px 0 4px">Quantas questões?</h3><div class="seg" id="qn">${[10,20,30,D.quiz.length].filter((v,i,a)=>a.indexOf(v)===i&&v<=D.quiz.length).map(v=>`<button data-v="${v}" class="${v===n?'on':''}">${v===D.quiz.length?'Todas ('+v+')':v}</button>`).join('')}</div>
 <h3 style="font-family:var(--hf);margin:6px 0 4px">${D.chapWord}</h3>${D.chapters.map(c=>`<label><input type="checkbox" value="${c.id}" ${sel.includes(c.id)?'checked':''}> ${c.n} · ${c.title} <span class="note">(${D.quiz.filter(q=>q.c===c.id).length})</span></label>`).join('')}
 <div class="row" style="margin-top:16px"><button class="btn" id="go">Começar</button>${S.get('wrong',[]).length?`<button class="btn g" id="gw">Refazer as que errei (${S.get('wrong',[]).length})</button>`:''}</div></div>`;
 app.querySelectorAll('#qn button').forEach(b=>b.onclick=()=>{n=+b.dataset.v;S.set('n',n);app.querySelectorAll('#qn button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#go').onclick=()=>{const s=[...app.querySelectorAll('.setup input:checked')].map(i=>i.value);if(!s.length)return;S.set('sel',s);start(interleave(D.quiz.filter(q=>s.includes(q.c))).slice(0,n))};
 const gw=$('#gw');if(gw)gw.onclick=()=>start(interleave(D.quiz.filter(q=>S.get('wrong',[]).includes(q.id))));
}
function start(list){Q={list,i:0,ans:[]};showQ()}
function shuffleOpts(q){const idx=q.a.map((_,i)=>i).sort(()=>Math.random()-.5);return idx}
function showQ(){
 const q=Q.list[Q.i];const order=shuffleOpts(q);const DIF={1:['Fácil','f'],2:['Média','m'],3:['Difícil','d']};
 app.innerHTML=`<div class="card"><div class="qtop"><span>Questão ${Q.i+1} de ${Q.list.length}</span><span>✓ ${Q.ans.filter(a=>a).length} · ✗ ${Q.ans.filter(a=>!a).length}</span></div>
 <div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
 <div class="row" style="gap:8px;align-items:center"><span class="dif ${DIF[q.d][1]}">${DIF[q.d][0]}</span><span class="note">${chapName(q.c)}</span></div>
 <p class="qstem">${q.q}</p><div id="opts">${order.map((oi,j)=>`<button class="opt" data-oi="${oi}"><b>${'ABCDE'[j]}</b><span>${q.a[oi]}</span></button>`).join('')}</div><div id="fb"></div>
 <div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn g" id="quit">Sair</button><button class="btn" id="nx" style="display:none">${Q.i<Q.list.length-1?'Próxima →':'Ver resultado'}</button></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const oi=+b.dataset.oi, ok=oi===q.k; Q.ans.push(ok);
  app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const xi=+x.dataset.oi;if(xi===q.k)x.classList.add('ok');if(x===b&&!ok){x.classList.add('no');if(q.w&&q.w[xi])x.querySelector('span').insertAdjacentHTML('beforeend',`<small>${q.w[xi]}</small>`)}});
  $('#fb').innerHTML=`<div class="exp ${ok?'ok':'no'}"><b>${ok?'Isso!':'Não foi dessa vez.'}</b> ${q.e}</div>`;
  let w=S.get('wrong',[]);w=ok?w.filter(x=>x!==q.id):[...new Set([...w,q.id])];S.set('wrong',w);
  $('#nx').style.display='inline-flex';$('#nx').focus()});
 $('#nx').onclick=()=>{Q.i++;Q.i<Q.list.length?showQ():result()};$('#quit').onclick=()=>{Q=null;setup()};
 window.scrollTo(0,0);
}
function result(){
 const n=Q.list.length,c=Q.ans.filter(a=>a).length,p=Math.round(c/n*100);if(p>S.get('best',0))S.set('best',p);
 const by={};Q.list.forEach((q,i)=>{by[q.c]=by[q.c]||[0,0];by[q.c][1]++;if(Q.ans[i])by[q.c][0]++});
 app.innerHTML=`<div class="card"><div class="kick">Resultado</div><div class="res-big">${c} / ${n}</div><p>${p>=80?'Muito bem! Revise só as pegadinhas.':p>=60?'Bom! Releia os capítulos com menos acertos.':'Releia o resumo dos capítulos com menos acertos e tente de novo.'}</p>
 <h3 style="font-family:var(--hf)">Por ${D.chapWordOne.toLowerCase()}</h3>${Object.entries(by).map(([k,[a,t]])=>`<div class="tbar"><span>${chapName(k)}</span><i><u style="width:${a/t*100}%"></u></i><b>${a}/${t}</b></div>`).join('')}
 <div class="row" style="margin-top:16px"><button class="btn" id="again">Novo simulado</button>${S.get('wrong',[]).length?`<button class="btn g" id="gw2">Refazer as que errei</button>`:''}</div></div>`;
 $('#again').onclick=setup;const g=$('#gw2');if(g)g.onclick=()=>start(interleave(D.quiz.filter(q=>S.get('wrong',[]).includes(q.id))));
}
// ---------- flashcards
function cards(){
 let deck=D.cards.map((_,i)=>i).sort(()=>Math.random()-.5),k=0,know=0;
 const draw=()=>{if(!deck.length){app.innerHTML=`<div class="card"><h2>Acabou! 🎉</h2><p>Você passou por todos os cartões.</p><button class="btn" id="re">Recomeçar</button></div>`;$('#re').onclick=cards;return}
  const c=D.cards[deck[0]];
  app.innerHTML=`<div class="card"><div class="kick">Flashcards</div><p class="note">Toque no cartão para virar. Faltam ${deck.length} · já sei ${know}</p>
  <div class="flip" id="fl"><div class="in"><div class="f">${c[0]}</div><div class="b">${c[1]}</div></div></div>
  <div class="row" style="justify-content:center"><button class="btn g" id="nk">Ainda não sei</button><button class="btn" id="ok">Já sei ✓</button></div></div>`;
  $('#fl').onclick=()=>$('#fl').classList.toggle('on');
  $('#ok').onclick=()=>{deck.shift();know++;draw()};$('#nk').onclick=()=>{deck.push(deck.shift());draw()}};
 draw();
}
function diss(){
 app.innerHTML=`<div class="card"><div class="kick">Dissertativas</div><h2>Treine a escrita</h2><p class="note">Escreva sua resposta (fica salva neste aparelho) e depois compare com o que a resposta precisa ter.</p>
 ${D.diss.map((d,i)=>`<div class="dq"><p class="qstem">${i+1}. ${d.q}</p><textarea data-i="${i}" placeholder="Escreva aqui...">${esc(S.get('d'+i,''))}</textarea><button class="btn g" data-s="${i}" style="margin-top:6px">Ver o que a resposta precisa ter</button><div class="ans" id="a${i}">${d.r}</div></div>`).join('')}</div>`;
 app.querySelectorAll('textarea').forEach(t=>t.oninput=()=>S.set('d'+t.dataset.i,t.value));
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>$('#a'+b.dataset.s).classList.toggle('show'));
}
function videos(){
 const play='<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fff" opacity=".95"/><path d="M26 20l18 12-18 12z" fill="#D7261E"/></svg>';
 app.innerHTML=`<div class="sec-h"><div><div class="kick">Vídeos</div><h2 style="margin:0">Aulas no YouTube</h2></div></div><p class="note">Os vídeos abrem no YouTube. Os marcados como “Busca” mostram uma lista de aulas daquele tema: escolha a de um canal confiável.</p>
 <div class="grid">${D.videos.map(v=>`<a class="vid" href="${v.url}" target="_blank" rel="noopener"><div class="th"><em>${chapName(v.c)}</em>${play}</div><div class="t"><b>${v.t}</b><span>${v.s}</span></div></a>`).join('')}</div>`;
}
function route(){
 const h=(location.hash||'#k--inicio').replace('#k--','');
 const cur=h.startsWith('cap-')?'resumo':h;tabs(cur);
 if(h==='inicio')home();else if(h==='resumo')chapter(D.chapters[0].id);else if(h.startsWith('cap-'))chapter(h.slice(4));
 else if(h==='simulado'){if(!Q)setup()}else if(h==='cards')cards();else if(h==='diss')diss();else if(h==='videos')videos();
 else if(D.extras.find(e=>e.id===h))extra(h);else home();
 if(h!=='simulado')Q=null;
}
window.addEventListener('hashchange',route);countdown();setInterval(countdown,6e4);route();
document.addEventListener('keydown',e=>{if(!Q)return;const k='abcde'.indexOf(e.key.toLowerCase());const o=app.querySelectorAll('.opt');if(k>=0&&o[k]&&!o[k].disabled)o[k].click();if(e.key==='Enter'&&$('#nx')&&$('#nx').style.display!=='none')$('#nx').click()});
</script></body></html>
