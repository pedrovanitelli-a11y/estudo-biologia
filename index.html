<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

a{color:var(--ac)}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--hd);color:var(--hdt)}

.row{display:flex;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:16px 0}
.plan label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.plan label:last-child{border:0}.plan input{width:22px;height:22px;accent-color:var(--ac);flex:none;margin-top:2px}
.plan .done span{text-decoration:line-through;opacity:.55}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.chipsnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chipsnav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:700;font-size:.88rem}
.chipsnav a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 30px;max-width:900px;margin:0 auto}
.chipsnav{max-width:900px;margin-left:auto;margin-right:auto}
@media(min-width:761px){.chipsnav{flex-wrap:wrap;overflow:visible}}
.card{max-width:860px;margin-left:auto;margin-right:auto}
.chap-h{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.chap-h .num{width:52px;height:52px;border-radius:14px;background:var(--ac);color:#fff;display:grid;place-items:center;font:800 1.5rem var(--hf);flex:none}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:99px;padding:6px 12px;font-size:.9rem;font-weight:700;border:0;color:var(--ink)}
.toggle i{width:34px;height:20px;border-radius:99px;background:#bbb;position:relative}.toggle i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.essential .toggle i{background:var(--ac)}.essential .toggle i:after{left:16px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.setup label{display:flex;gap:10px;align-items:center;padding:8px 0}.setup input{width:20px;height:20px;accent-color:var(--ac)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:.9rem;color:var(--mut)}

.opt:hover:not([disabled]){border-color:var(--ac)}
.opt.ok{border-color:#2F7A4A;background:#EAF6EE}.opt.ok b{background:#2F7A4A;color:#fff;border-color:#2F7A4A}
.opt.no{border-color:#B83A3A;background:#FCECEC}.opt.no b{background:#B83A3A;color:#fff;border-color:#B83A3A}
.opt small{display:block;color:#7A3030;font-size:.85rem;margin-top:3px}
.exp{border-radius:12px;padding:12px 14px;margin:6px 0 12px;background:var(--soft)}.exp.ok{border-left:5px solid #2F7A4A}.exp.no{border-left:5px solid #B83A3A}
.res-big{font:800 3.4rem var(--hf);color:var(--ac);line-height:1}
.tbar{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}.tbar i{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.tbar i u{display:block;height:100%;background:var(--ac)}
.flip{perspective:1000px;height:260px;margin:10px 0 14px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:grid;place-items:center;text-align:center;padding:24px;border:1px solid var(--line)}
.flip .f{background:var(--card);font:800 1.5rem var(--hf)}.flip .b{background:var(--ac);color:#fff;transform:rotateY(180deg);font-size:1.15rem}
.dq{margin-bottom:16px}.dq textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--card);color:var(--ink)}
.ans{display:none;border-left:5px solid #2F7A4A;background:#EAF6EE;border-radius:0 12px 12px 0;padding:12px 14px;margin-top:8px;color:#1E2A22}.ans.show{display:block}
.vid{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink)}

.three>div>b:first-child,.cmp>div>b:first-child,.eng>div>b:first-child,.pgs>div>b:first-child,.sub>div>b:first-child{display:block;font-family:var(--hf);color:var(--ac);margin-bottom:3px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}

.flow i{font-style:normal;align-self:center;color:var(--ac);font-weight:800}
.vs{display:grid;grid-template-columns:1fr 34px 1fr;margin:12px 0 16px}

.pyr .p1{width:60%;background:#8C3B1E;color:#fff}.pyr .p2{width:80%;background:#D98A3D;color:#fff}.pyr .p3{width:100%;background:#F3DCC3;color:#2A1F17}

.sh{font-family:var(--hf);color:var(--ac);margin:12px 0 8px}
.final{background:var(--ink);color:#fff;border-radius:14px;padding:16px 20px}.final h4{color:var(--gold)}.final ol{padding-left:20px}
.tb{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:.95rem;background:var(--card);border-radius:12px;overflow:hidden}

.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}.tb td:first-child{font-weight:700}
.fig{margin:8px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;overflow-x:auto;max-height:none!important}.fig>div{height:auto!important}.fig svg{width:100%;height:auto;max-height:260px}
.fig.small svg{max-width:420px}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:center;margin:10px 0}
.duo .fig{margin:0}
.ph{border-bottom:1px solid var(--line);padding:8px 0}.ph>b:first-child{display:inline-block;width:42px;color:var(--ac);font:800 1.1rem var(--hf)}
.spec{display:flex;border-radius:10px;overflow:hidden;margin:6px 0 12px}.spec span{flex:1;color:#fff;text-align:center;font:800 .75rem var(--hf);padding:8px 0}

.essential .content>p:not(.ideia),.essential .content>h3+p{display:none}
@media(max-width:700px){.two,.sgrid,.chips,.pgs,.duo{grid-template-columns:1fr}.three,.cmp,.eng,.sub{grid-template-columns:1fr 1fr}
.flow{flex-wrap:wrap;gap:6px 4px}.flow span{flex:1 1 38%;font-size:.86rem;padding:8px 6px}.flow i{font-size:.9rem}.vs{grid-template-columns:1fr}.vs .x{padding:2px}.tl div{flex-basis:33%}
.fig svg{max-height:200px}.fig.wide svg,.fig svg[viewBox^="0 0 520"],.fig svg[viewBox^="0 0 560"],.fig svg[viewBox^="0 0 330"]{min-width:520px;max-height:none}.duo .fig svg{max-height:180px}
.fig:has(svg[viewBox^="0 0 520"])::after,.fig:has(svg[viewBox^="0 0 560"])::after,.fig:has(svg[viewBox^="0 0 330"])::after{content:"↔ arraste para ver o esquema todo";display:block;font-size:.78rem;color:var(--mut);margin-top:4px;position:sticky;left:0}.tb{font-size:.86rem}.tb th,.tb td{padding:7px 7px}.content h3{font-size:1.12rem;margin-top:20px}.ideia{font-size:1rem}.pyr .p1,.pyr .p2{width:100%}}

<header class="top"><div class="tb1"><svg class="logo" viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="17" ry="14" fill="none" stroke="#B9E35A" stroke-width="2.5"/><circle cx="18" cy="19" r="6" fill="#B9E35A"/></svg><div class="brand"><b>Biologia · 3º trimestre</b><small>Citologia, energia e divisão celular</small></div><div class="cd" id="cd"></div></div><nav class="tabs" id="tabs"></nav></header>
<main id="app"></main>
<footer>Material de estudo · Biologia · 1ª série</footer>
<script>
const D={"key": "bio3_", "exam": "2026-11-24", "kicker": "Prova amanhã · 8 temas", "heroTitle": "Da organela à meiose, sem enrolação", "heroText": "Resumo com esquemas de cada tema, pegadinhas, simulado com 80 questões e explicação de cada alternativa, flashcards e vídeos.", "chapWord": "Temas", "chapWordOne": "Tema", "chapters": [{"id": "org", "n": "1", "title": "Organelas: lisossomos, peroxissomos e morte celular", "short": "Organelas", "hint": "Lisossomos, peroxissomos e apoptose", "html": "\n<p class=\"ideia\"><b>Em uma frase:</b> o lisossomo é o “estômago” da célula (digere), e o peroxissomo é o “desintoxicador” (quebra H₂O₂).</p>\n<h3>Lisossomos</h3>\n<div class=\"fig\" style=\"max-height:34mm\"><div style=\"height:34mm\"><svg viewBox=\"0 0 520 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\">\n<defs><marker id=\"a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#7A8590\"/></marker></defs>\n<g font-size=\"11\" text-anchor=\"middle\" fill=\"#1E2A33\">\n<rect x=\"4\" y=\"30\" width=\"78\" height=\"44\" rx=\"10\" fill=\"#E3EEF7\" stroke=\"#1F4E79\"/><text x=\"43\" y=\"50\" font-weight=\"800\">RE rugoso</text><text x=\"43\" y=\"64\" font-size=\"9\">faz as enzimas</text>\n<rect x=\"104\" y=\"30\" width=\"78\" height=\"44\" rx=\"10\" fill=\"#E3EEF7\" stroke=\"#1F4E79\"/><text x=\"143\" y=\"50\" font-weight=\"800\">Golgi</text><text x=\"143\" y=\"64\" font-size=\"9\">empacota</text>\n<circle cx=\"230\" cy=\"52\" r=\"24\" fill=\"#FBE3D3\" stroke=\"#B4531F\"/><text x=\"230\" y=\"49\" font-weight=\"800\" font-size=\"10\">Lisossomo</text><text x=\"230\" y=\"61\" font-size=\"9\">pH ≈ 5</text>\n<circle cx=\"320\" cy=\"52\" r=\"24\" fill=\"#E6F2EE\" stroke=\"#16705A\"/><circle cx=\"314\" cy=\"48\" r=\"7\" fill=\"#16705A\"/><text x=\"320\" y=\"92\" font-size=\"9\">fagossomo</text>\n<circle cx=\"405\" cy=\"52\" r=\"26\" fill=\"#FBE3D3\" stroke=\"#B4531F\"/><circle cx=\"400\" cy=\"49\" r=\"5\" fill=\"#16705A\" opacity=\".5\"/><text x=\"405\" y=\"94\" font-size=\"9\">vacúolo digestivo</text>\n<circle cx=\"485\" cy=\"52\" r=\"18\" fill=\"#EEE\" stroke=\"#7A8590\"/><text x=\"485\" y=\"94\" font-size=\"9\">corpo residual</text>\n</g>\n<g stroke=\"#7A8590\" stroke-width=\"1.6\" marker-end=\"url(#a)\"><path d=\"M82 52H102\"/><path d=\"M182 52H204\"/><path d=\"M254 52H294\"/><path d=\"M344 52H377\"/><path d=\"M431 52H465\"/></g>\n<text x=\"320\" y=\"20\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#7A8590\">bactéria englobada + lisossomo</text></svg></div></div>\n<div class=\"two\"><div class=\"box\"><h4>Como nasce</h4>As <b>enzimas digestivas (hidrolases)</b> são feitas no <b>RE rugoso</b>. O <b>complexo golgiense</b> empacota essas enzimas e forma o lisossomo. Sem Golgi = sem lisossomos novos.</div>\n<div class=\"box\"><h4>pH ácido = trava de segurança</h4>Dentro do lisossomo o pH é <b>≈ 5</b>. Se ele estourar, as enzimas quase não funcionam no citosol (pH ≈ 7). A acidez é mantida por uma <b>bomba de H⁺</b> que gasta <b>ATP</b>: transporte <b>ativo</b>.</div></div>\n<div class=\"three\"><div><b>Heterofagia</b>digere o que vem de <b>fora</b>: fagossomo → vacúolo digestivo → corpo residual → eliminado (clasmocitose)</div><div><b>Autofagia</b>digere partes da <b>própria</b> célula (organelas velhas) e <b>recicla</b> o material</div><div><b>Apoptose</b>morte <b>programada</b>. Ex.: some a pele entre os dedos do embrião. Gera corpos apoptóticos, <b>sem inflamação</b></div></div>\n<h3>Peroxissomos e glioxissomos</h3>\n<div class=\"two\"><div class=\"box g\"><h4>Peroxissomo</h4>Tem <b>oxidases</b>, que produzem H₂O₂ (água oxigenada, tóxica), e a <b>catalase</b>, que a desmonta: <b>2 H₂O₂ → 2 H₂O + O₂</b>. Muito presente no fígado e nos rins (ajuda a desintoxicar, como no caso do álcool).</div>\n<div class=\"box g\"><h4>Glioxissomo (só em plantas)</h4>Comum em <b>sementes com gordura</b> (girassol, mamona). Pelo <b>ciclo do glioxilato</b>, transforma <b>lipídios em açúcar</b> para a semente germinar antes de fazer fotossíntese.</div></div>\n<h3>Resumo das organelas desta matéria</h3><table class=\"tb\"><tr><th>Organela</th><th>Função principal</th></tr><tr><td>RE rugoso</td><td>tem ribossomos; produz proteínas, como as enzimas do lisossomo</td></tr><tr><td>Complexo golgiense</td><td>empacota, modifica e “envia” substâncias; forma os lisossomos</td></tr><tr><td>Lisossomo</td><td>digestão (hetero e autofagia) com hidrolases ácidas</td></tr><tr><td>Peroxissomo</td><td>oxidações e quebra de H₂O₂ pela catalase</td></tr></table><div class=\"key\"><b>Não confunda:</b> lisossomo = <b>hidrolases</b> (digestão) × peroxissomo = <b>oxidases + catalase</b> (oxidação e H₂O₂).</div>"}, {"id": "bio", "n": "2", "title": "Bioenergética: ATP, NAD e glicólise", "short": "Bioenergética", "hint": "ATP, NAD e glicólise", "html": "\n<p class=\"ideia\"><b>Em uma frase:</b> a célula quebra glicose para recarregar a “bateria” <b>ATP</b>, e o <b>NAD</b> funciona como “caminhão” que carrega elétrons e hidrogênios.</p>\n<div class=\"two\"><div class=\"box\"><h4>Catabolismo × anabolismo</h4><b>Catabolismo</b> = <b>quebrar</b> moléculas e <b>liberar</b> energia (ex.: quebrar glicose).<br><b>Anabolismo</b> = <b>construir</b> moléculas e <b>gastar</b> energia (ex.: fazer proteínas).</div>\n<div class=\"box\"><h4>NAD⁺ → NADH</h4>O NAD⁺ <b>recebe</b> elétrons e H da glicose e vira <b>NADH</b>. Receber elétrons = sofrer <b>redução</b>. Depois o NADH entrega essa carga na mitocôndria.</div></div>\n<h3>ATP: a bateria da célula</h3>\n<div class=\"fig small\"><svg viewBox=\"0 0 300 90\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\">\n<g font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1E2A33\">\n<rect x=\"6\" y=\"28\" width=\"66\" height=\"34\" rx=\"8\" fill=\"#E3EEF7\" stroke=\"#1F4E79\"/><text x=\"39\" y=\"49\" font-weight=\"800\">Adenina</text>\n<path d=\"M90 28L120 28L128 45L120 62L90 62L82 45Z\" fill=\"#E6F2EE\" stroke=\"#16705A\"/><text x=\"105\" y=\"49\" font-weight=\"800\">Ribose</text>\n<circle cx=\"160\" cy=\"45\" r=\"16\" fill=\"#FBE3D3\" stroke=\"#B4531F\"/><text x=\"160\" y=\"49\" font-weight=\"800\">P</text>\n<circle cx=\"205\" cy=\"45\" r=\"16\" fill=\"#FBE3D3\" stroke=\"#B4531F\"/><text x=\"205\" y=\"49\" font-weight=\"800\">P</text>\n<circle cx=\"250\" cy=\"45\" r=\"16\" fill=\"#FBE3D3\" stroke=\"#B4531F\"/><text x=\"250\" y=\"49\" font-weight=\"800\">P</text>\n<path d=\"M72 45H82M128 45H144M176 45H189M221 45H234\" stroke=\"#1E2A33\" stroke-width=\"2\"/>\n<path d=\"M226 30l4 -12M226 60l4 12\" stroke=\"#B4531F\" stroke-width=\"2\"/>\n<text x=\"250\" y=\"16\" font-size=\"9\" fill=\"#B4531F\">sai este = energia</text>\n<text x=\"150\" y=\"86\" font-size=\"9\" fill=\"#7A8590\">ATP  →  ADP + Pi + energia</text></g></svg></div>\n<p>ATP = <b>adenina + ribose + 3 fosfatos</b>. Quando perde um fosfato (<b>hidrólise</b>), vira <b>ADP + Pi</b> e libera energia para o trabalho da célula.</p>\n<h3>Glicólise: o primeiro passo</h3>\n<div class=\"flow\"><span><b>1 glicose</b><br>6 carbonos</span><i>→</i><span>gasta <b>2 ATP</b><br><small>(investimento: fosforila a glicose)</small></span><i>→</i><span>forma <b>4 ATP</b> + <b>2 NADH</b></span><i>→</i><span><b>2 piruvatos</b><br>3 carbonos cada</span></div>\n<div class=\"chips\"><span>Ocorre no <b>citosol</b></span><span><b>Não</b> precisa de O₂</span><span><b>Não</b> libera CO₂</span><span>Saldo: <b>2 ATP</b> (4 feitos − 2 gastos)</span></div>\n<h3>Tipos de organismos e o “aceptor final”</h3>\n<div class=\"three\"><div><b>Respiração aeróbia</b>o último a receber os elétrons é o <b>O₂</b> (vira água)</div><div><b>Respiração anaeróbia</b>aceptor final é <b>inorgânico, mas não é O₂</b> (nitrato, sulfato, CO₂ nas arqueias que fazem metano)</div><div><b>Fermentação</b>aceptor final é uma molécula <b>orgânica</b> e não há cadeia respiratória</div></div>\n<div class=\"two\"><div class=\"box\"><h4>Anaeróbio obrigatório</h4>Não vive com O₂ (ex.: bactéria do tétano).</div><div class=\"box\"><h4>Anaeróbio facultativo</h4>Vive <b>com ou sem</b> O₂: respira ou fermenta (ex.: levedura).</div></div>"}, {"id": "resp", "n": "3", "title": "Respiração celular e fermentação", "short": "Respiração", "hint": "Krebs, cadeia e fermentação", "html": "\n<p class=\"ideia\"><b>Equação:</b> C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energia (ATP). A respiração tira o <b>máximo</b> de energia da glicose; a fermentação tira <b>pouco</b>.</p>\n<div class=\"duo\"><div class=\"fig\"><svg viewBox=\"0 0 300 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\">\n<ellipse cx=\"150\" cy=\"75\" rx=\"140\" ry=\"62\" fill=\"#FBE3D3\" stroke=\"#B4531F\" stroke-width=\"3\"/>\n<ellipse cx=\"150\" cy=\"75\" rx=\"128\" ry=\"51\" fill=\"#FDF2EA\" stroke=\"#B4531F\" stroke-width=\"1.5\"/>\n<path d=\"M45 30 v38 q0 10 10 10 q10 0 10 -10 v-30 M85 120 v-38 q0 -10 10 -10 q10 0 10 10 v30 M125 28 v38 q0 10 10 10 q10 0 10 -10 v-30 M165 122 v-38 q0 -10 10 -10 q10 0 10 10 v30 M205 30 v38 q0 10 10 10 q10 0 10 -10 v-30\" fill=\"none\" stroke=\"#B4531F\" stroke-width=\"2\"/>\n<path d=\"M235 60 q8 -10 16 0 q8 10 16 0\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/>\n<g font-size=\"10\" fill=\"#1E2A33\" text-anchor=\"middle\"><text x=\"150\" y=\"145\" font-weight=\"800\">cristas = cadeia respiratória</text><text x=\"252\" y=\"88\" font-size=\"9\">DNA próprio</text><text x=\"110\" y=\"70\" font-size=\"9.5\" font-weight=\"800\">matriz = Krebs</text></g></svg></div><div class=\"box\"><h4>Mitocôndria</h4>Duas membranas. A interna forma as <b>cristas</b>, onde fica a <b>cadeia respiratória</b>. O interior é a <b>matriz</b>, onde ocorre o <b>ciclo de Krebs</b>.<br><br><b>Endossimbiose (Lynn Margulis):</b> a mitocôndria veio de uma <b>bactéria</b> engolida há muito tempo. Provas: tem <b>DNA circular próprio</b>, ribossomos parecidos com os de bactérias, <b>dupla membrana</b> e se divide sozinha. O cloroplasto veio de uma <b>cianobactéria</b>.</div></div>\n<h3>As 3 etapas</h3>\n<table class=\"tb\"><tr><th>Etapa</th><th>Onde</th><th>O que acontece</th><th>Rende</th></tr>\n<tr><td>1. Glicólise</td><td>citosol</td><td>glicose → 2 piruvatos</td><td>2 ATP, 2 NADH</td></tr>\n<tr><td>Ponte</td><td>matriz</td><td>cada piruvato → <b>acetil-CoA</b>, solta <b>1 CO₂</b></td><td>1 NADH por piruvato</td></tr>\n<tr><td>2. Ciclo de Krebs</td><td>matriz</td><td>acetil-CoA é desmontado; solta <b>CO₂</b></td><td>por glicose: 2 ATP, 6 NADH, 2 FADH₂, 4 CO₂</td></tr>\n<tr><td>3. Cadeia respiratória</td><td>cristas</td><td>NADH e FADH₂ entregam elétrons; o <b>O₂</b> recebe no final e vira <b>água</b></td><td>a maior parte do ATP</td></tr></table>\n<p>Total: cerca de <b>30 a 32 ATP</b> por glicose (livros mais antigos falam em 36 ou 38). O <b>CO₂ que expiramos</b> vem da <b>ponte e do Krebs</b>; o <b>O₂ que respiramos</b> vira <b>água</b> na cadeia.</p>\n<h3>Fermentação</h3>\n<div class=\"two\"><div class=\"box o\"><h4>Alcoólica</h4>Feita por <b>leveduras</b>. Piruvato → <b>etanol + CO₂</b>. Usada no pão (o CO₂ faz crescer) e em bebidas.</div><div class=\"box o\"><h4>Lática</h4>Feita por <b>lactobacilos</b> e pelos <b>nossos músculos</b> com pouco O₂. Piruvato → <b>ácido lático</b>, <b>sem CO₂</b>. Usada no iogurte.</div></div>\n<div class=\"key\"><b>Por que fermentar?</b> Para <b>regenerar o NAD⁺</b>. Sem NAD⁺ livre, a glicólise para. A fermentação rende só os <b>2 ATP</b> da glicólise.</div>"}, {"id": "foto", "n": "4", "title": "Cloroplastos e fotossíntese", "short": "Fotossíntese", "hint": "Cloroplasto, fase clara e Calvin", "html": "\n<p class=\"ideia\"><b>Equação:</b> 6 CO₂ + 12 H₂O + luz → C₆H₁₂O₆ + 6 O₂ + 6 H₂O. A planta usa a luz para transformar CO₂ e água em <b>glicose</b>.</p>\n<div class=\"duo\"><div class=\"fig\"><svg viewBox=\"0 0 300 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\">\n<ellipse cx=\"150\" cy=\"75\" rx=\"140\" ry=\"62\" fill=\"#DFF0E4\" stroke=\"#16705A\" stroke-width=\"3\"/>\n<ellipse cx=\"150\" cy=\"75\" rx=\"130\" ry=\"53\" fill=\"#F1F8F2\" stroke=\"#16705A\" stroke-width=\"1.5\"/>\n<g><rect x=\"60\" y=\"52\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"60\" y=\"61\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"60\" y=\"70\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"60\" y=\"79\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"60\" y=\"88\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/></g><g><rect x=\"110\" y=\"38\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"110\" y=\"47\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"110\" y=\"56\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"110\" y=\"65\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"110\" y=\"74\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/></g><g><rect x=\"160\" y=\"58\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"160\" y=\"67\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"160\" y=\"76\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"160\" y=\"85\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"160\" y=\"94\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/></g><g><rect x=\"210\" y=\"44\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"210\" y=\"53\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"210\" y=\"62\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"210\" y=\"71\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/><rect x=\"210\" y=\"80\" width=\"30\" height=\"7\" rx=\"3.5\" fill=\"#2E9B5F\"/></g>\n<path d=\"M90 70H110M140 62H160M190 72H210\" stroke=\"#2E9B5F\" stroke-width=\"2\"/>\n<g font-size=\"10\" fill=\"#1E2A33\" text-anchor=\"middle\"><text x=\"150\" y=\"145\" font-weight=\"800\">granum = pilha de tilacoides</text><text x=\"150\" y=\"122\" font-size=\"9.5\" font-weight=\"800\">estroma (Calvin)</text></g></svg></div><div class=\"box g\"><h4>Cloroplasto</h4>Duas membranas. Dentro há sacos chamados <b>tilacoides</b>. Uma pilha de tilacoides é um <b>granum</b> (plural: <b>grana</b>), onde está a <b>clorofila</b>. O líquido em volta é o <b>estroma</b>. Tem <b>DNA próprio</b> (endossimbiose).</div></div>\n<h3>Luz e pigmentos</h3>\n<div class=\"spec\"><span style=\"background:#6B3FA0\">violeta</span><span style=\"background:#2F5FC4\">azul</span><span style=\"background:#3A9A4A\">verde</span><span style=\"background:#E3B23C\">amarelo</span><span style=\"background:#E07B2E\">laranja</span><span style=\"background:#C8322A\">vermelho</span></div>\n<p>A <b>clorofila a</b> absorve muito o <b>azul/violeta</b> e o <b>vermelho</b>. O <b>verde</b> é pouco absorvido e é <b>refletido</b>: por isso vemos as folhas verdes. A <b>clorofila b</b> e os <b>carotenoides</b> são <b>pigmentos acessórios</b>: captam outras cores e passam a energia para a clorofila a.</p>\n<h3>As duas etapas</h3>\n<div class=\"two\"><div class=\"box g\"><h4>1. Fotoquímica (fase clara)</h4><b>Onde:</b> tilacoides (grana).<br>A luz excita a clorofila. Ocorre a <b>fotólise da água</b>: H₂O é quebrada e libera <b>O₂</b>, elétrons e H⁺.<br><b>Produz:</b> <b>ATP</b> e <b>NADPH</b> (+ O₂ que vai para o ar).</div>\n<div class=\"box\"><h4>2. Química (ciclo de Calvin)</h4><b>Onde:</b> estroma.<br>Usa o <b>ATP</b> e o <b>NADPH</b> da fase 1. A enzima <b>RuBisCO</b> fixa o <b>CO₂</b>, e forma-se <b>glicose</b>.<br>Não usa luz diretamente, mas <b>depende indiretamente</b> dela.</div></div>\n<div class=\"flow\"><span>Luz + H₂O</span><i>→</i><span><b>fotólise</b>: O₂ sai</span><i>→</i><span><b>ATP + NADPH</b></span><i>→</i><span>Calvin + CO₂ (RuBisCO)</span><i>→</i><span><b>glicose</b></span></div>\n<h3>Fotossíntese × respiração</h3><table class=\"tb\"><tr><th></th><th>Fotossíntese</th><th>Respiração aeróbia</th></tr><tr><td>Onde</td><td>cloroplasto</td><td>citosol + mitocôndria</td></tr><tr><td>Usa</td><td>CO₂ + H₂O + luz</td><td>glicose + O₂</td></tr><tr><td>Produz</td><td>glicose + O₂</td><td>CO₂ + H₂O + ATP</td></tr><tr><td>Energia</td><td><b>guarda</b> energia (anabolismo)</td><td><b>libera</b> energia (catabolismo)</td></tr><tr><td>Quem faz</td><td>plantas, algas, cianobactérias</td><td>quase todos os seres, <b>inclusive as plantas</b></td></tr></table><div class=\"key\"><b>Pegadinha clássica:</b> o O₂ liberado vem da <b>água</b>, não do CO₂ (prova com oxigênio marcado ¹⁸O). E no <b>escuro</b> o ciclo de Calvin também para, porque acabam o ATP e o NADPH.</div>"}, {"id": "nuc", "n": "5", "title": "Núcleo e cromossomos", "short": "Núcleo", "hint": "Cromatina, cromossomos e telômeros", "html": "\n<p class=\"ideia\"><b>Em uma frase:</b> o núcleo guarda o DNA. O DNA fica <b>solto</b> (cromatina) quando a célula trabalha e <b>enrolado</b> (cromossomo) quando ela vai se dividir.</p>\n<div class=\"three\"><div><b>Carioteca</b>membrana dupla com <b>poros</b> (complexo do poro) que controlam o que entra e sai, como os ribossomos</div><div><b>Nucléolo</b>produz o <b>RNA ribossômico</b> e monta os ribossomos</div><div><b>Cromatina</b>DNA + proteínas <b>histonas</b></div></div>\n<div class=\"two\"><div class=\"box\"><h4>Eucromatina</h4>Pouco condensada, genes <b>ativos</b> (sendo lidos).</div><div class=\"box\"><h4>Heterocromatina</h4>Muito condensada, genes <b>inativos</b>.</div></div>\n<h3>Compactação do DNA (do menor ao maior)</h3>\n<div class=\"flow\"><span>DNA</span><i>→</i><span>nucleossomo<br><small>DNA enrolado em histonas</small></span><i>→</i><span>fibra de cromatina</span><i>→</i><span>alças</span><i>→</i><span><b>cromossomo</b> metafásico</span></div>\n<h3>O cromossomo</h3>\n<div class=\"fig\"><svg viewBox=\"0 0 330 125\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\"><g><rect x=\"20\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#1F4E79\"/><rect x=\"36\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#5A8FC2\"/><circle cx=\"34\" cy=\"55\" r=\"6\" fill=\"#B4531F\"/><text x=\"34\" y=\"118\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1E2A33\">metacêntrico</text></g><g><rect x=\"105\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#1F4E79\"/><rect x=\"121\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#5A8FC2\"/><circle cx=\"119\" cy=\"45\" r=\"6\" fill=\"#B4531F\"/><text x=\"119\" y=\"118\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1E2A33\">submetacêntrico</text></g><g><rect x=\"190\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#1F4E79\"/><rect x=\"206\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#5A8FC2\"/><circle cx=\"204\" cy=\"30\" r=\"6\" fill=\"#B4531F\"/><text x=\"204\" y=\"118\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1E2A33\">acrocêntrico</text></g><g><rect x=\"275\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#1F4E79\"/><rect x=\"291\" y=\"20\" width=\"12\" height=\"70\" rx=\"6\" fill=\"#5A8FC2\"/><circle cx=\"289\" cy=\"22\" r=\"6\" fill=\"#B4531F\"/><text x=\"289\" y=\"118\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1E2A33\">telocêntrico</text></g><text x=\"165\" y=\"10\" font-size=\"9\" text-anchor=\"middle\" fill=\"#7A8590\">2 cromátides-irmãs unidas pelo centrômero (laranja)</text></svg></div>\n<p>Depois da duplicação, cada cromossomo tem <b>2 cromátides-irmãs</b> iguais, presas pelo <b>centrômero</b>. A posição do centrômero dá o nome. O <b>telocêntrico não existe na espécie humana</b>.</p>\n<div class=\"two\"><div class=\"box\"><h4>Telômeros</h4>As <b>pontas</b> do cromossomo. Protegem e <b>encurtam a cada divisão</b>. A enzima <b>telomerase</b> refaz os telômeros em células-tronco, germinativas e em células de <b>câncer</b>.</div>\n<div class=\"box\"><h4>2n e n</h4><b>Diploide (2n):</b> pares de homólogos. Humanos: <b>46</b>.<br><b>Haploide (n):</b> um de cada. Gametas: <b>23</b> = <b>22 autossomos + 1 sexual</b> (X ou Y).</div></div>\n<div class=\"key\"><b>Cariótipo:</b> foto dos cromossomos organizados em pares. É feito na <b>metáfase</b>, quando eles estão <b>mais condensados</b> e fáceis de ver (usa-se colchicina para parar a divisão nessa fase).</div>"}, {"id": "ciclo", "n": "6", "title": "Ciclo celular", "short": "Ciclo celular", "hint": "Interfase, G0 e pontos de checagem", "html": "\n<p class=\"ideia\"><b>Em uma frase:</b> a célula passa a maior parte da vida na <b>interfase</b> (crescendo e copiando o DNA) e só uma parte pequena se <b>dividindo</b> (fase M).</p>\n<div class=\"duo r\"><div class=\"fig\"><svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\"><path d=\"M100.0 30.0 A70 70 0 0 1 135.0 160.6\" fill=\"none\" stroke=\"#7FB8A4\" stroke-width=\"22\"/><path d=\"M132.9 161.8 A70 70 0 0 1 31.1 87.8\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"22\"/><path d=\"M31.5 85.4 A70 70 0 0 1 65.0 39.4\" fill=\"none\" stroke=\"#5A8FC2\" stroke-width=\"22\"/><path d=\"M67.1 38.2 A70 70 0 0 1 97.6 30.0\" fill=\"none\" stroke=\"#B4531F\" stroke-width=\"22\"/>\n<g font-size=\"11\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\"><text x=\"160\" y=\"72\">G1</text><text x=\"104\" y=\"176\">S</text><text x=\"40\" y=\"104\">G2</text><text x=\"74\" y=\"38\" font-size=\"10\">M</text></g>\n<g font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1E2A33\"><text x=\"100\" y=\"96\" font-weight=\"800\">INTERFASE</text><text x=\"100\" y=\"110\">G1 + S + G2</text></g></svg></div><div>\n<div class=\"ph\"><b>G1</b>cresce e produz proteínas e organelas</div>\n<div class=\"ph\"><b>S</b>(síntese) <b>duplica o DNA</b> e os centríolos</div>\n<div class=\"ph\"><b>G2</b>se prepara para dividir e confere o DNA</div>\n<div class=\"ph\"><b>M</b>mitose ou meiose + citocinese</div>\n<div class=\"ph\"><b>G0</b>a célula <b>para de se dividir</b> (ex.: neurônios maduros)</div></div></div>\n<div class=\"key\"><b>Interfase NÃO é repouso!</b> É a fase de <b>maior atividade</b> metabólica: a célula cresce e duplica o DNA.</div>\n<h3>DNA (C) × cromossomos (n)</h3>\n<table class=\"tb\"><tr><th>Fase</th><th>Quantidade de DNA</th><th>Nº de cromossomos</th></tr><tr><td>G1</td><td>2C</td><td>2n</td></tr><tr><td>Depois da fase S (G2)</td><td><b>4C</b> (dobrou)</td><td>2n (<b>não</b> muda: cada um tem 2 cromátides)</td></tr></table>\n<h3>Pontos de verificação (os “fiscais”)</h3>\n<div class=\"three\"><div><b>G1 (restrição)</b>Ambiente e tamanho estão bons? DNA está sem dano? Só então segue para S</div><div><b>G2</b>O DNA foi copiado certo? Se o dano não tem conserto → <b>apoptose</b></div><div><b>M</b>Todos os cromossomos estão presos ao <b>fuso</b>? Se não, a divisão espera</div></div>\n<div class=\"box\"><h4>Exemplo de conta (cai muito)</h4>Célula <b>2n = 8</b>. Em <b>G1</b>: 8 cromossomos, DNA = <b>2C</b>. Em <b>G2</b>: continuam <b>8 cromossomos</b>, mas cada um tem 2 cromátides → <b>16 cromátides</b> e DNA = <b>4C</b>.</div><div class=\"two\"><div class=\"box o\"><h4>Câncer</h4>É uma doença do ciclo celular: os <b>pontos de controle falham</b> e a célula se divide sem parar, formando tumores.</div><div class=\"box\"><h4>Limite de Hayflick</h4>Células normais param após cerca de <b>40 a 60 divisões</b>, porque os <b>telômeros</b> ficam curtos demais.</div></div>"}, {"id": "mit", "n": "7", "title": "Mitose", "short": "Mitose", "hint": "Fases, PMAT e citocinese", "html": "\n<p class=\"ideia\"><b>Em uma frase:</b> a mitose faz <b>2 células iguais</b> à mãe. Se a mãe é 2n, as filhas são 2n; se é n, as filhas são n. Serve para <b>crescer, repor e regenerar</b>.</p>\n<div class=\"fig wide\"><svg viewBox=\"0 0 560 112\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\"><g><rect x=\"4\" y=\"10\" width=\"92\" height=\"80\" rx=\"40\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M24 32L36 48M36 32L24 48\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M49 47L61 63M61 47L49 63\" stroke=\"#B4531F\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M64 27L76 43M76 27L64 43\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"106\" font-size=\"10\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1E2A33\">Prófase</text></g><g><rect x=\"116\" y=\"10\" width=\"92\" height=\"80\" rx=\"40\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M162 14V86\" stroke=\"#9AA6B1\" stroke-dasharray=\"3 3\"/><path d=\"M156 22L168 38M168 22L156 38\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M156 42L168 58M168 42L156 58\" stroke=\"#B4531F\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M156 62L168 78M168 62L156 78\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"162\" y=\"106\" font-size=\"10\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1E2A33\">Metáfase</text></g><g><rect x=\"228\" y=\"10\" width=\"92\" height=\"80\" rx=\"40\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M252 30l6 -6M252 30l6 6\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M296 30l-6 -6M296 30l-6 6\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M252 50l6 -6M252 50l6 6\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M296 50l-6 -6M296 50l-6 6\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M252 70l6 -6M252 70l6 6\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M296 70l-6 -6M296 70l-6 6\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"274\" y=\"106\" font-size=\"10\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1E2A33\">Anáfase</text></g><g><rect x=\"340\" y=\"10\" width=\"92\" height=\"80\" rx=\"40\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M386 12V88\" stroke=\"#9AA6B1\" stroke-width=\"3\"/><circle cx=\"363\" cy=\"50\" r=\"18\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/><circle cx=\"409\" cy=\"50\" r=\"18\" fill=\"none\" stroke=\"#1F4E79\" stroke-width=\"2\"/><text x=\"386\" y=\"106\" font-size=\"10\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1E2A33\">Telófase</text></g><g><circle cx=\"478\" cy=\"50\" r=\"28\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><circle cx=\"536\" cy=\"50\" r=\"22\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><text x=\"505\" y=\"106\" font-size=\"10\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#1E2A33\">Citocinese</text></g></svg></div>\n<table class=\"tb\"><tr><th>Fase</th><th>O que acontece (palavra-chave)</th></tr>\n<tr><td>Prófase</td><td>cromossomos <b>condensam</b>, nucléolo some, forma-se o <b>fuso</b></td></tr>\n<tr><td>Prometáfase</td><td>a <b>carioteca se desfaz</b>; as fibras se prendem aos <b>cinetócoros</b></td></tr>\n<tr><td>Metáfase</td><td>cromossomos <b>alinhados no meio</b> (placa metafásica); <b>máxima condensação</b></td></tr>\n<tr><td>Anáfase</td><td>centrômeros se dividem e as <b>cromátides-irmãs se separam</b> para os polos</td></tr>\n<tr><td>Telófase</td><td>a carioteca <b>reaparece</b> e os cromossomos <b>descondensam</b></td></tr>\n<tr><td>Citocinese</td><td>o citoplasma se divide</td></tr></table>\n<p class=\"mn\">Para lembrar a ordem: <b>P</b>ro<b>M</b>e<b>A</b>na<b>T</b>elo → “<b>PMAT</b>”.</p>\n<div class=\"two\"><div class=\"box\"><h4>Célula animal</h4>Tem <b>centríolos</b> e ásteres: mitose <b>cêntrica e astral</b>.<br>Citocinese <b>centrípeta</b>: estrangula de fora para dentro.</div>\n<div class=\"box g\"><h4>Célula vegetal</h4>Sem centríolos: mitose <b>acêntrica e anastral</b>.<br>Citocinese <b>centrífuga</b>: forma uma placa (lamela média) do meio para fora.</div></div>\n<div class=\"box g\" style=\"margin-bottom:2.4mm\"><h4>Onde a mitose acontece?</h4>Nas células do corpo (<b>somáticas</b>): crescimento, <b>cicatrização</b>, renovação da pele e do sangue. Nos seres unicelulares, a mitose é a própria <b>reprodução</b> (assexuada).</div><div class=\"three\"><div><b>Colchicina</b>desmonta o fuso: a divisão <b>para na metáfase</b></div><div><b>Conta da metáfase</b>célula 2n = 6 tem <b>6 cromossomos</b> e <b>12 cromátides</b></div><div><b>Quantas divisões?</b>1 → 2 → 4 → 8 → 16 → 32: <b>5 divisões</b> (2⁵ = 32)</div></div>"}, {"id": "mei", "n": "8", "title": "Meiose", "short": "Meiose", "hint": "Prófase I, crossing-over e síndromes", "html": "\n<p class=\"ideia\"><b>Em uma frase:</b> a meiose faz <b>4 células com metade dos cromossomos</b> (2n → n), todas <b>diferentes</b>. Serve para formar <b>gametas</b> e gerar <b>variabilidade</b>.</p>\n<div class=\"fig wide\"><svg viewBox=\"0 0 560 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Archivo, sans-serif\">\n<defs><marker id=\"b\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#7A8590\"/></marker></defs>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"#1E2A33\">\n<circle cx=\"50\" cy=\"55\" r=\"40\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M32 47L44 63M44 47L32 63\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M56 47L68 63M68 47L56 63\" stroke=\"#B4531F\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"112\" font-weight=\"800\">2n (duplicada)</text>\n<circle cx=\"190\" cy=\"30\" r=\"24\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M184 22L196 38M196 22L184 38\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"190\" cy=\"85\" r=\"24\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M184 77L196 93M196 77L184 93\" stroke=\"#B4531F\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<text x=\"120\" y=\"20\" font-size=\"9\" fill=\"#16705A\" font-weight=\"800\">MEIOSE I</text><text x=\"120\" y=\"32\" font-size=\"8.5\" fill=\"#16705A\">separa homólogos</text>\n<circle cx=\"350\" cy=\"14\" r=\"13\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M350 7V21\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"350\" cy=\"44\" r=\"13\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M350 37V51\" stroke=\"#1F4E79\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"350\" cy=\"72\" r=\"13\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M350 65V79\" stroke=\"#B4531F\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"350\" cy=\"102\" r=\"13\" fill=\"#F4F7F9\" stroke=\"#9AA6B1\"/><path d=\"M350 95V109\" stroke=\"#B4531F\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<text x=\"275\" y=\"20\" font-size=\"9\" fill=\"#16705A\" font-weight=\"800\">MEIOSE II</text><text x=\"275\" y=\"32\" font-size=\"8.5\" fill=\"#16705A\">separa cromátides</text>\n<text x=\"450\" y=\"52\" font-weight=\"800\" font-size=\"12\">4 células n</text><text x=\"450\" y=\"68\" font-size=\"9.5\">diferentes entre si</text></g>\n<g stroke=\"#7A8590\" stroke-width=\"1.6\" marker-end=\"url(#b)\"><path d=\"M92 45L162 32\"/><path d=\"M92 65L162 82\"/><path d=\"M216 28L333 16\"/><path d=\"M216 32L333 44\"/><path d=\"M216 82L333 72\"/><path d=\"M216 88L333 100\"/></g></svg></div>\n<div class=\"two\"><div class=\"box g\"><h4>Meiose I: reducional</h4>Separa os <b>cromossomos homólogos</b>. O número cai pela metade (2n → n). No fim da telófase I, cada célula é <b>n, mas com cromossomos ainda duplicados</b>.</div>\n<div class=\"box\"><h4>Meiose II: equacional</h4>Separa as <b>cromátides-irmãs</b>, como numa mitose. Antes dela ocorre a <b>intercinese</b>, que <b>não duplica o DNA</b>.</div></div>\n<h3>Prófase I: as 5 subfases</h3>\n<div class=\"sub\"><div><b>Leptóteno</b>cromossomos começam a condensar</div><div><b>Zigóteno</b>homólogos se emparelham: <b>sinapse</b> (complexo sinaptonêmico)</div><div><b>Paquíteno</b><b>crossing-over</b>: troca de pedaços entre homólogos</div><div><b>Diplóteno</b>homólogos se afastam; aparecem os <b>quiasmas</b> (X)</div><div><b>Diacinese</b>máxima condensação; carioteca se desfaz</div></div>\n<p class=\"mn\">Para lembrar: “<b>Le</b>ão <b>Zi</b>ca <b>Pa</b>ra <b>Di</b>a <b>Di</b>ferente”.</p>\n<div class=\"two\"><div class=\"box\"><h4>De onde vem a variabilidade?</h4>1) <b>Crossing-over</b> (paquíteno).<br>2) <b>Segregação independente</b>: na metáfase I, cada par se posiciona ao acaso.</div>\n<div class=\"box o\"><h4>Não disjunção</h4>Quando cromossomos <b>não se separam</b> direito, os gametas ficam com um a mais (n+1) ou um a menos (n−1).</div></div>\n<table class=\"tb\"><tr><th>Momento</th><th>DNA</th><th>Cromossomos</th></tr><tr><td>G1</td><td>2C</td><td>2n</td></tr><tr><td>Depois da fase S</td><td>4C</td><td>2n (duplicados)</td></tr><tr><td>Fim da meiose I</td><td>2C</td><td>n (duplicados)</td></tr><tr><td>Fim da meiose II</td><td>C</td><td>n (simples)</td></tr></table><table class=\"tb\"><tr><th>Síndrome</th><th>Cariótipo</th><th>O que é</th></tr><tr><td>Down</td><td>47, +21</td><td>trissomia do cromossomo 21</td></tr><tr><td>Klinefelter</td><td>47, XXY</td><td>X a mais no sexo masculino</td></tr><tr><td>Turner</td><td>45, X0</td><td>falta um X no sexo feminino</td></tr></table>"}], "extras": [{"id": "revisao", "title": "Mitose × meiose e pegadinhas", "html": "\n<table class=\"tb big\"><tr><th></th><th>Mitose</th><th>Meiose</th></tr>\n<tr><td>Nº de divisões</td><td>1</td><td>2 (meiose I e II)</td></tr><tr><td>Células formadas</td><td>2</td><td>4</td></tr>\n<tr><td>Cromossomos</td><td>iguais à mãe (2n → 2n)</td><td>metade (2n → n)</td></tr><tr><td>Células-filhas</td><td><b>idênticas</b></td><td><b>diferentes</b></td></tr>\n<tr><td>Crossing-over</td><td>não</td><td>sim (paquíteno)</td></tr><tr><td>Para quê</td><td>crescer, repor, regenerar</td><td>formar gametas e variabilidade</td></tr></table>\n<h3>Pegadinhas que mais caem</h3>\n<div class=\"pgs\">\n<div><b>Glicólise</b>no citosol, sem O₂ e sem CO₂; saldo 2 ATP</div>\n<div><b>Krebs</b>na matriz; cadeia respiratória nas cristas</div>\n<div><b>O₂ da fotossíntese</b>vem da <b>água</b>, não do CO₂</div>\n<div><b>Folha verde</b>a clorofila <b>reflete</b> o verde</div>\n<div><b>Fermentação</b>serve para regenerar o NAD⁺</div>\n<div><b>Lática</b>não solta CO₂; alcoólica solta</div>\n<div><b>Interfase</b>não é repouso: é a fase mais ativa</div>\n<div><b>Depois da fase S</b>DNA dobra (4C), cromossomos não (2n)</div>\n<div><b>Anáfase da mitose</b>separa cromátides; anáfase I separa homólogos</div>\n<div><b>Intercinese</b>não tem fase S</div>\n<div><b>Peroxissomo</b>catalase quebra H₂O₂; lisossomo digere</div>\n<div><b>Apoptose</b>morte programada sem inflamação</div>\n</div>\n<div class=\"key\">Ordem para estudar se tiver pouco tempo: <b>pegadinhas</b> → <b>tabela mitose × meiose</b> → <b>respiração e fotossíntese</b> → questões.</div>"}], "extraTabs": [["revisao", "Mitose × meiose"]], "plan": ["Ler <b>Mitose × meiose e pegadinhas</b> — 10 min", "Ler <b>Respiração</b> e <b>Fotossíntese</b> (os que mais caem em conta)", "Ler os outros temas no modo “Só o essencial”", "Fazer um <b>simulado de 20</b> questões", "Refazer as que errou", "Passar os <b>flashcards</b> antes de dormir"], "quiz": [{"id": "b0", "c": "org", "d": 2, "q": "Uma célula teve o complexo golgiense danificado, mas o RE rugoso continua funcionando normalmente. O processo DIRETAMENTE prejudicado será:", "a": ["a formação de novos lisossomos", "a síntese de enzimas digestivas", "a produção de RNA no nucléolo", "a fotossíntese nos cloroplastos", "a duplicação do DNA na fase S"], "k": 0, "e": "As enzimas hidrolíticas são feitas no RE rugoso, mas quem as recebe, empacota e forma os lisossomos (por brotamento da face trans) é o complexo golgiense. Sem ele, não surgem novos lisossomos.", "w": [null, "A síntese das enzimas ocorre no RE rugoso, que continua funcionando.", "O RNA ribossômico é feito no nucléolo, sem depender do Golgi.", "Fotossíntese depende do cloroplasto, não do complexo golgiense.", "A duplicação do DNA ocorre no núcleo, na fase S, sem relação com o Golgi."]}, {"id": "b1", "c": "org", "d": 2, "q": "Um lisossomo se rompe e libera suas hidrolases no citosol, mas o dano à célula é pequeno. A melhor explicação é que essas enzimas:", "a": ["funcionam mal no pH neutro do citosol", "são destruídas pela catalase do citosol", "só atuam quando há luz sobre a célula", "precisam do núcleo para serem ativadas", "perdem a forma pela falta de oxigênio"], "k": 0, "e": "As hidrolases são ÁCIDAS: funcionam bem em pH 4,5–5,0 (interior do lisossomo). No citosol, que é praticamente neutro (≈7,2), ficam pouco ativas — é uma trava de segurança da célula.", "w": [null, "A catalase decompõe H₂O₂ (água oxigenada), não destrói enzimas.", "As hidrolases não dependem de luz para funcionar.", "O núcleo não ativa as hidrolases; o que importa é o pH ácido.", "A forma das enzimas não depende de oxigênio; o problema é o pH."]}, {"id": "b2", "c": "org", "d": 2, "q": "A manutenção do pH ácido no interior do lisossomo depende de uma bomba de H⁺ que realiza transporte:", "a": ["ativo, gastando ATP para levar H⁺ para dentro", "passivo, levando H⁺ para fora sem gastar ATP", "ativo, gastando ATP para levar H⁺ para fora", "passivo, levando H⁺ para dentro sem gastar ATP", "ativo, gastando NADH para tirar H⁺ do lisossomo"], "k": 0, "e": "A bomba de prótons (ATPase tipo V) empurra H⁺ do citosol para DENTRO do lisossomo, contra o gradiente de concentração. Mover algo contra o gradiente é transporte ativo e gasta ATP.", "w": [null, "Contra o gradiente o transporte é ativo, e o H⁺ vai para dentro, não para fora.", "Levar H⁺ para fora deixaria o lisossomo menos ácido, o oposto do necessário.", "Sem gasto de energia não seria possível acumular H⁺ contra o gradiente.", "A energia vem da hidrólise do ATP, e o H⁺ entra no lisossomo, não sai."]}, {"id": "b3", "c": "org", "d": 2, "q": "Um macrófago engloba uma bactéria por fagocitose. A sequência correta das estruturas formadas até a eliminação dos restos é:", "a": ["fagossomo → vacúolo digestivo → corpo residual", "vacúolo digestivo → fagossomo → corpo residual", "corpo residual → fagossomo → vacúolo digestivo", "fagossomo → corpo residual → vacúolo digestivo", "lisossomo → fagossomo → peroxissomo → núcleo"], "k": 0, "e": "Na heterofagia, a partícula englobada forma o FAGOSSOMO; ele se funde ao lisossomo primário e vira VACÚOLO DIGESTIVO (lisossomo secundário), onde ocorre a digestão; os restos formam o CORPO RESIDUAL, eliminado por clasmocitose.", "w": [null, "O vacúolo digestivo só existe depois que o fagossomo se funde ao lisossomo.", "O corpo residual é o FINAL do processo, não o começo.", "O corpo residual aparece depois da digestão, que ocorre no vacúolo digestivo.", "Peroxissomo e núcleo não participam da digestão de uma bactéria fagocitada."]}, {"id": "b4", "c": "org", "d": 2, "q": "Hepatócitos reciclam cerca de metade de suas macromoléculas por semana. O processo lisossômico responsável por essa renovação é a:", "a": ["autofagia", "heterofagia", "apoptose", "clasmocitose", "fagocitose"], "k": 0, "e": "Na AUTOFAGIA, partes da própria célula (como organelas danificadas) são envolvidas por membrana, fundem-se ao lisossomo e são digeridas; o material útil volta ao citosol e é reaproveitado.", "w": [null, "Heterofagia digere material vindo de FORA da célula.", "Apoptose é a morte programada da célula inteira, não uma reciclagem.", "Clasmocitose é só a eliminação do corpo residual.", "Fagocitose é o englobamento de partículas externas."]}, {"id": "b5", "c": "org", "d": 2, "q": "Durante a formação do embrião humano, as células localizadas entre os dedos desaparecem. Esse evento é um exemplo de:", "a": ["apoptose, morte celular programada", "autofagia, reciclagem de organelas", "heterofagia, digestão de partículas", "necrose, morte acidental por lesão", "mitose, divisão de células iguais"], "k": 0, "e": "A separação dos dedos ocorre porque as células entre eles morrem de forma organizada e programada: é a APOPTOSE, que também elimina células infectadas ou danificadas.", "w": [null, "Na autofagia a célula sobrevive e só recicla partes.", "Heterofagia é digerir material externo, não eliminar células do embrião.", "Necrose é morte acidental, sem programação; não é o caso.", "Mitose formaria mais células, não faria as células sumirem."]}, {"id": "b6", "c": "org", "d": 2, "q": "Na apoptose, a célula se fragmenta sem provocar inflamação no tecido. Isso acontece porque:", "a": ["os corpos apoptóticos são fagocitados", "o núcleo libera enzimas no sangue", "as mitocôndrias se dividem sem parar", "a célula se funde com as vizinhas", "o lisossomo forma uma nova membrana"], "k": 0, "e": "Na apoptose o núcleo se condensa, surgem bolhas e a célula se fragmenta em CORPOS APOPTÓTICOS, que são fagocitados por células vizinhas ou macrófagos, sem deixar vestígios.", "w": [null, "Liberar enzimas no sangue causaria dano, não evitaria inflamação.", "Divisão de mitocôndrias não tem relação com a limpeza da célula morta.", "A célula não se funde às vizinhas; ela se fragmenta.", "O que evita a inflamação é a fagocitose dos fragmentos."]}, {"id": "b7", "c": "org", "d": 2, "q": "O peróxido de hidrogênio (H₂O₂), formado em várias reações celulares, é tóxico. A organela e a enzima que o decompõem são:", "a": ["peroxissomo e catalase", "lisossomo e catalase", "peroxissomo e protease", "glioxissomo e lipase", "lisossomo e oxidase"], "k": 0, "e": "A CATALASE, presente nos PEROXISSOMOS, decompõe a água oxigenada: 2 H₂O₂ → 2 H₂O + O₂, protegendo a célula.", "w": [null, "O lisossomo contém hidrolases, não catalase.", "Protease digere proteínas; não decompõe H₂O₂.", "Glioxissomo converte lipídios em açúcar; lipase não age sobre H₂O₂.", "As oxidases PRODUZEM H₂O₂ e ficam no peroxissomo, não no lisossomo."]}, {"id": "b8", "c": "org", "d": 3, "q": "Sementes de girassol armazenam muita gordura. Durante a germinação, antes de a fotossíntese começar, a plântula obtém açúcar a partir dessa gordura graças aos:", "a": ["glioxissomos, pelo ciclo do glioxilato", "lisossomos, pela digestão de amido", "peroxissomos, pela ação da catalase", "cloroplastos, pela etapa fotoquímica", "ribossomos, pela síntese de proteína"], "k": 0, "e": "Os GLIOXISSOMOS, presentes em sementes oleaginosas e plântulas, convertem ácidos graxos em açúcares pelo CICLO DO GLIOXILATO, fornecendo energia até a fotossíntese se estabelecer.", "w": [null, "O problema é converter gordura, não digerir amido.", "A catalase decompõe H₂O₂; não transforma gordura em açúcar.", "A fotossíntese ainda não começou nessa fase da semente.", "Ribossomos fazem proteínas, não convertem lipídios em açúcar."]}, {"id": "b9", "c": "org", "d": 2, "q": "Lisossomos e peroxissomos são organelas membranosas, mas diferem principalmente quanto:", "a": ["ao tipo de enzima: hidrolítica ou oxidativa", "à presença de DNA próprio em seu interior", "à capacidade de fazer fotossíntese no escuro", "ao número de membranas: uma ou três camadas", "à produção de ATP pela quebra da glicose"], "k": 0, "e": "Lisossomos têm enzimas HIDROLÍTICAS (digestão intracelular); peroxissomos têm enzimas OXIDATIVAS (oxidases e catalase).", "w": [null, "Nenhuma das duas organelas tem DNA próprio.", "Nenhuma delas faz fotossíntese.", "Ambas têm uma membrana; nenhuma tem três.", "A produção de ATP pela quebra da glicose ocorre no citosol e na mitocôndria."]}, {"id": "b10", "c": "bio", "d": 2, "q": "A quebra da glicose para liberar energia e a síntese de proteínas a partir de aminoácidos são exemplos, respectivamente, de:", "a": ["catabolismo e anabolismo", "anabolismo e catabolismo", "catabolismo e catabolismo", "anabolismo e anabolismo", "fermentação e catabolismo"], "k": 0, "e": "CATABOLISMO = desmontar moléculas e liberar energia (quebra da glicose). ANABOLISMO = montar moléculas consumindo energia (síntese de proteínas).", "w": [null, "A ordem está invertida.", "Montar proteínas é anabolismo, não catabolismo.", "Quebrar glicose é catabolismo, não anabolismo.", "A síntese de proteínas não é fermentação nem catabolismo."]}, {"id": "b11", "c": "bio", "d": 2, "q": "Quando o ATP é hidrolisado para fornecer energia a um trabalho celular, ele se transforma em:", "a": ["ADP + fosfato inorgânico", "AMP + dois fosfatos livres", "ADP + uma molécula de NAD⁺", "ATP + uma molécula de água", "adenina + ribose + glicose"], "k": 0, "e": "Na hidrólise (quebra com participação de água), o ATP perde um grupo fosfato: ATP + H₂O → ADP + Pi + energia.", "w": [null, "Formar AMP exigiria perder dois fosfatos; na hidrólise comum perde-se um.", "O NAD⁺ é outra coenzima; não surge da quebra do ATP.", "A água é consumida na hidrólise; o ATP não continua ATP.", "A molécula não se desmonta inteira, e glicose não faz parte do ATP."]}, {"id": "b12", "c": "bio", "d": 1, "q": "A molécula de ATP (trifosfato de adenosina) é formada por:", "a": ["adenina, ribose e três fosfatos", "timina, ribose e três fosfatos", "adenina, glicose e três fosfatos", "adenina, ribose e dois fosfatos", "uracila, ribose e três fosfatos"], "k": 0, "e": "ATP = adenosina (base adenina + açúcar ribose) + TRÊS grupos fosfato (por isso 'tri'fosfato).", "w": [null, "A base do ATP é a adenina, não a timina.", "O açúcar é a ribose (5 carbonos), não a glicose.", "Com dois fosfatos a molécula é o ADP.", "A base é a adenina, não a uracila."]}, {"id": "b13", "c": "bio", "d": 2, "q": "Na glicólise, a coenzima NAD⁺ recebe elétrons e prótons retirados da glicose. Nessa reação, o NAD⁺ é:", "a": ["reduzido, formando NADH", "oxidado, formando NADH", "reduzido, formando NADP⁺", "oxidado, formando FADH₂", "hidrolisado, liberando ATP"], "k": 0, "e": "Ganhar elétrons é REDUÇÃO. O NAD⁺ recebe 2 elétrons e 1 próton e vira NADH (forma reduzida, 'carregada').", "w": [null, "Oxidar é PERDER elétrons; o NAD⁺ ganha.", "NADP⁺ é outra coenzima (fotossíntese) e está na forma oxidada.", "FADH₂ vem do FAD, não do NAD⁺, e o processo é de redução.", "O NAD⁺ não é hidrolisado e não libera ATP nessa reação."]}, {"id": "b14", "c": "bio", "d": 2, "q": "Na glicólise formam-se 4 ATP, mas o saldo final por molécula de glicose é de apenas 2 ATP. Isso ocorre porque:", "a": ["2 ATP são gastos na fase de investimento", "2 ATP são perdidos como calor no citosol", "2 ATP são levados para dentro do núcleo", "2 ATP são usados para fixar o CO₂ do ar", "2 ATP viram NADH na fase de compensação"], "k": 0, "e": "Na fase de INVESTIMENTO a célula gasta 2 ATP para fosforilar a glicose; na fase de compensação formam-se 4 ATP. Saldo: 4 − 2 = 2 ATP.", "w": [null, "Os ATP não 'viram calor'; eles são gastos na fosforilação da glicose.", "O núcleo não recebe ATP da glicólise como parte do saldo.", "Fixar CO₂ é papel do ciclo de Calvin, na fotossíntese.", "ATP e NADH são moléculas diferentes; um não se transforma no outro."]}, {"id": "b15", "c": "bio", "d": 1, "q": "Sobre a glicólise, assinale a afirmação correta:", "a": ["ocorre no citosol e não libera CO₂", "ocorre na matriz e libera dois CO₂", "ocorre no citosol e exige oxigênio", "ocorre nas cristas e forma lactato", "ocorre no núcleo e forma 32 ATP"], "k": 0, "e": "A glicólise ocorre no CITOSOL, com ou sem O₂, transforma a glicose em 2 piruvatos e NÃO libera CO₂.", "w": [null, "A matriz é o local do ciclo de Krebs; a glicólise não libera CO₂.", "A glicólise não exige oxigênio: ocorre também na fermentação.", "Não ocorre nas cristas, e o lactato só aparece na fermentação lática.", "Não ocorre no núcleo, e rende saldo de apenas 2 ATP."]}, {"id": "b16", "c": "bio", "d": 2, "q": "Na fase de investimento da glicólise, a glicose recebe grupos fosfato vindos do ATP. A principal vantagem disso é que a glicose:", "a": ["fica mais reativa e retida na célula", "perde carbonos e vira gás carbônico", "passa a ser transportada ao núcleo", "transforma-se diretamente em etanol", "ganha elétrons e se converte em NADH"], "k": 0, "e": "A glicose fosforilada fica quimicamente mais REATIVA e fica RETIDA na célula, o que permite a continuação da glicólise.", "w": [null, "A glicólise não libera CO₂.", "A glicose não é levada ao núcleo.", "Etanol só aparece na fermentação alcoólica, após o piruvato.", "Quem vira NADH é o NAD⁺, não a glicose."]}, {"id": "b17", "c": "bio", "d": 2, "q": "O que diferencia a respiração anaeróbia da fermentação quanto ao destino final dos elétrons?", "a": ["anaeróbia: aceptor inorgânico; fermentação: orgânico", "anaeróbia: aceptor orgânico; fermentação: inorgânico", "anaeróbia: aceptor é o O₂; fermentação: o piruvato", "anaeróbia: aceptor é o NAD⁺; fermentação: é o CO₂", "ambas usam o oxigênio como aceptor final de elétrons"], "k": 0, "e": "Na respiração ANAERÓBIA o aceptor final é INORGÂNICO (sulfato, nitrato, carbonato). Na FERMENTAÇÃO é ORGÂNICO (piruvato ou um derivado dele).", "w": [null, "A relação está invertida.", "Respiração anaeróbia não usa O₂.", "NAD⁺ é aceptor intermediário, e o CO₂ não é aceptor na fermentação.", "Nenhuma das duas usa oxigênio."]}, {"id": "b18", "c": "bio", "d": 2, "q": "Uma levedura cresce tanto em meio com oxigênio (respirando) quanto sem oxigênio (fermentando). Ela é classificada como:", "a": ["anaeróbia facultativa", "anaeróbia obrigatória", "aeróbia obrigatória", "fotossintetizante", "autótrofa estrita"], "k": 0, "e": "Organismos que fazem respiração aeróbia com O₂ e fermentação sem ele são ANAERÓBIOS FACULTATIVOS.", "w": [null, "Anaeróbios obrigatórios não sobrevivem na presença de O₂.", "Aeróbios obrigatórios não sobrevivem sem O₂.", "Levedura é fungo heterótrofo; não faz fotossíntese.", "Levedura não produz o próprio alimento; é heterótrofa."]}, {"id": "b19", "c": "bio", "d": 2, "q": "Em pântanos sem oxigênio, arqueias usam CO₂ para oxidar H₂ e liberam metano (CH₄). Esse processo é um exemplo de:", "a": ["respiração anaeróbia", "fermentação alcoólica", "respiração aeróbia", "fermentação lática", "fotossíntese de algas"], "k": 0, "e": "As arqueias METANOGÊNICAS fazem RESPIRAÇÃO ANAERÓBIA: usam um aceptor inorgânico (CO₂) e produzem metano, só na ausência de O₂.", "w": [null, "A fermentação alcoólica produz etanol e CO₂, não metano.", "Não há oxigênio no ambiente descrito.", "A fermentação lática produz lactato.", "Não há luz nem produção de glicose descritas."]}, {"id": "b20", "c": "resp", "d": 1, "q": "Qual equação representa corretamente a respiração celular aeróbia?", "a": ["C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O", "6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂", "C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂", "C₆H₁₂O₆ + 6 CO₂ → 6 O₂ + 6 H₂O", "C₆H₁₂O₆ + 6 H₂O → 6 O₂ + 6 CO₂"], "k": 0, "e": "Na respiração aeróbia, glicose + oxigênio → gás carbônico + água + energia (ATP + calor).", "w": [null, "Essa é a equação da fotossíntese (o inverso).", "Essa é a fermentação alcoólica (etanol + CO₂).", "CO₂ é produto da respiração, não reagente.", "O₂ é reagente da respiração, não produto."]}, {"id": "b21", "c": "resp", "d": 1, "q": "As cristas mitocondriais correspondem a:", "a": ["dobras da membrana interna", "dobras da membrana externa", "grânulos de DNA na matriz", "pilhas de sacos achatados", "poros da membrana dupla"], "k": 0, "e": "A membrana INTERNA da mitocôndria forma dobras, as CRISTAS, que aumentam a superfície; a membrana externa é lisa.", "w": [null, "A membrana externa é lisa, sem dobras.", "O DNA fica na matriz, mas não forma as cristas.", "Pilhas de sacos achatados são os grana do cloroplasto.", "Poros são do envelope nuclear, não da mitocôndria."]}, {"id": "b22", "c": "resp", "d": 1, "q": "Qual característica da mitocôndria é usada como evidência da teoria endossimbiótica?", "a": ["possuir DNA circular e ribossomos próprios", "possuir hidrolases ácidas e pH muito baixo", "ser formada a partir do complexo golgiense", "ter uma única membrana, igual ao lisossomo", "não conseguir se dividir dentro da célula"], "k": 0, "e": "DNA CIRCULAR (como o das bactérias), ribossomos próprios, dupla membrana, síntese de proteínas e autorreplicação indicam que a mitocôndria veio de uma bactéria englobada.", "w": [null, "Hidrolases ácidas e pH baixo são do lisossomo.", "A mitocôndria não se forma do Golgi; ela se autorreplica.", "A mitocôndria tem DUAS membranas.", "A mitocôndria se divide sozinha (autorreplicação)."]}, {"id": "b23", "c": "resp", "d": 2, "q": "Segundo Lynn Margulis, a origem da mitocôndria e a do cloroplasto envolveram, respectivamente, o englobamento de:", "a": ["bactéria aeróbia e cianobactéria", "cianobactéria e bactéria aeróbia", "bactéria anaeróbia e protozoário", "vírus e cianobactéria marinha", "fungo unicelular e alga verde"], "k": 0, "e": "Mitocôndria: um ancestral anaeróbio englobou uma BACTÉRIA AERÓBIA. Cloroplasto: depois, CIANOBACTÉRIAS fotossintetizantes foram englobadas.", "w": [null, "A ordem está invertida.", "A bactéria englobada era aeróbia, e protozoário não originou cloroplastos.", "Vírus não originaram mitocôndrias.", "Fungos e algas são eucariontes; os englobados eram procariontes."]}, {"id": "b24", "c": "resp", "d": 3, "q": "Ao entrar na mitocôndria, cada piruvato é transformado em acetil-CoA. Nessa etapa, POR PIRUVATO, são formados:", "a": ["1 CO₂ e 1 NADH", "2 CO₂ e 3 NADH", "1 ATP e 1 FADH₂", "2 ATP e 2 NADH", "0 CO₂ e 1 ATP"], "k": 0, "e": "Cada piruvato é descarboxilado (perde 1 C como CO₂) e oxidado (NAD⁺ → NADH); o acetil restante se liga à coenzima A. Por piruvato: 1 CO₂ + 1 NADH + 1 acetil-CoA.", "w": [null, "2 CO₂ e 3 NADH são produtos de UMA volta do ciclo de Krebs.", "Não há formação de ATP nem de FADH₂ nessa etapa.", "2 ATP e 2 NADH é o saldo da glicólise.", "Há liberação de CO₂ (descarboxilação) e não há ATP."]}, {"id": "b25", "c": "resp", "d": 1, "q": "O ciclo de Krebs (ciclo do ácido cítrico) ocorre:", "a": ["na matriz mitocondrial", "nas cristas mitocondriais", "no citoplasma da célula", "no estroma do cloroplasto", "no espaço intermembranar"], "k": 0, "e": "O ciclo de Krebs ocorre na MATRIZ mitocondrial, onde estão as enzimas do ciclo.", "w": [null, "As cristas são o local da etapa final da respiração, não do Krebs.", "No citosol ocorre a glicólise.", "No estroma ocorre o ciclo de Calvin (fotossíntese).", "O espaço intermembranar fica entre as membranas; não abriga o ciclo."]}, {"id": "b26", "c": "resp", "d": 3, "q": "Considerando as DUAS voltas do ciclo de Krebs geradas por uma glicose, são produzidos:", "a": ["4 CO₂, 2 ATP, 6 NADH e 2 FADH₂", "2 CO₂, 1 ATP, 3 NADH e 1 FADH₂", "6 CO₂, 4 ATP, 10 NADH e 2 FADH₂", "4 CO₂, 4 ATP, 2 NADH e 6 FADH₂", "2 CO₂, 2 ATP, 6 NADH e 4 FADH₂"], "k": 0, "e": "Cada volta produz 2 CO₂, 1 ATP, 3 NADH e 1 FADH₂. Uma glicose gera 2 acetil-CoA → 2 voltas: 4 CO₂, 2 ATP, 6 NADH e 2 FADH₂.", "w": [null, "Esse é o resultado de apenas UMA volta.", "Esse é o total somando glicólise, oxidação do piruvato e Krebs.", "Os valores de NADH e FADH₂ estão trocados e o ATP está dobrado.", "Os números de CO₂ e de FADH₂ estão errados."]}, {"id": "b27", "c": "resp", "d": 1, "q": "O CO₂ que eliminamos na expiração é produzido, na respiração celular, durante:", "a": ["a oxidação do piruvato e o ciclo de Krebs", "a glicólise e a fermentação nos músculos", "a glicólise e a oxidação de cada piruvato", "o ciclo de Krebs e a quebra da água pela luz", "apenas a glicólise, no citosol das células"], "k": 0, "e": "O CO₂ sai na OXIDAÇÃO DO PIRUVATO (descarboxilação) e no CICLO DE KREBS, ambos na mitocôndria.", "w": [null, "A glicólise não libera CO₂, e a fermentação lática também não.", "A glicólise não libera CO₂.", "Fotólise da água ocorre na fotossíntese e libera O₂.", "A glicólise não libera CO₂."]}, {"id": "b28", "c": "resp", "d": 2, "q": "Um padeiro usa fermento biológico (leveduras) e um laticínio usa lactobacilos. Comparando as duas fermentações, é correto afirmar que:", "a": ["só a alcoólica libera CO₂, que faz o pão subir", "apenas a lática libera CO₂, que faz o pão subir", "as duas liberam CO₂ e produzem etanol no final", "as duas produzem lactato e não liberam o CO₂", "só a lática ocorre sem a presença de oxigênio"], "k": 0, "e": "Na fermentação ALCOÓLICA o piruvato é descarboxilado (sai CO₂) e vira acetaldeído, depois etanol; o CO₂ faz a massa crescer. Na LÁTICA o piruvato vira lactato SEM liberar CO₂.", "w": [null, "A lática não libera CO₂.", "A lática produz lactato, não etanol, e não libera CO₂.", "A alcoólica produz etanol e libera CO₂.", "As duas ocorrem sem oxigênio."]}, {"id": "b29", "c": "resp", "d": 1, "q": "Na ausência de O₂, a fermentação é essencial para a célula porque:", "a": ["regenera o NAD⁺, permitindo que a glicólise continue", "produz 32 ATP por glicose, como na respiração aeróbia", "fixa o CO₂ do ar e produz glicose para os músculos", "usa o O₂ como o aceptor final dos elétrons do NADH", "quebra o lactato em água e gás carbônico no fígado"], "k": 0, "e": "Sem O₂, o NADH da glicólise não tem onde descarregar. A fermentação passa esses elétrons ao piruvato (ou derivado), REGENERANDO O NAD⁺ e mantendo a glicólise funcionando (2 ATP).", "w": [null, "A fermentação rende só os 2 ATP da glicólise.", "Fixar CO₂ é papel da fotossíntese.", "A fermentação ocorre justamente SEM oxigênio.", "No fígado o lactato volta a piruvato; isso não é a fermentação."]}, {"id": "b30", "c": "foto", "d": 3, "q": "Plantas receberam água marcada com oxigênio pesado (¹⁸O) e CO₂ comum. O oxigênio pesado apareceu:", "a": ["no O₂ liberado, pois vem da fotólise da água", "na glicose, pois vem da fixação do gás CO₂", "no CO₂ liberado, pois é produto da respiração", "no amido, pois ele vem da etapa fotoquímica", "no NADPH, pois é formado no ciclo de Calvin"], "k": 0, "e": "O O₂ liberado na fotossíntese vem da ÁGUA, quebrada na FOTÓLISE durante a etapa fotoquímica. Por isso o ¹⁸O da água aparece no O₂.", "w": [null, "O oxigênio da glicose vem do CO₂, que não estava marcado.", "O CO₂ liberado na respiração não vem diretamente da água marcada.", "O amido é feito na etapa química, a partir do CO₂.", "NADPH não contém oxigênio e é formado na etapa fotoquímica."]}, {"id": "b31", "c": "foto", "d": 2, "q": "No cloroplasto, as pilhas de tilacoides, onde há maior concentração de clorofila, são chamadas de:", "a": ["grana", "estroma", "lamelas", "cristas", "lúmen"], "k": 0, "e": "Cada pilha de tilacoides é um GRANUM (plural GRANA). Os tilacoides concentram clorofila e carotenoides.", "w": [null, "Estroma é a matriz líquida do cloroplasto.", "Lamelas ligam os tilacoides de grana diferentes.", "Cristas são dobras da membrana interna da mitocôndria.", "Lúmen é o espaço interno de cada tilacoide."]}, {"id": "b32", "c": "foto", "d": 2, "q": "Ao analisar o espectro de absorção da clorofila a, observa-se maior absorção nas faixas:", "a": ["azul-violeta e vermelha", "verde e amarelo-laranja", "verde e azul-violeta", "amarela e infravermelha", "vermelha e verde-clara"], "k": 0, "e": "No gráfico do espectro, a clorofila a tem picos no AZUL-VIOLETA (~430 nm) e no VERMELHO (~660 nm).", "w": [null, "O verde é a faixa MENOS absorvida.", "O verde é refletido, não absorvido.", "O infravermelho fica fora da luz visível usada pela clorofila.", "O verde é refletido, mesmo o verde-claro."]}, {"id": "b33", "c": "foto", "d": 2, "q": "Enxergamos as folhas verdes porque a luz verde, em relação à clorofila, é principalmente:", "a": ["refletida", "absorvida", "produzida", "convertida", "armazenada"], "k": 0, "e": "A clorofila quase não absorve o verde: essa luz é REFLETIDA e chega aos nossos olhos.", "w": [null, "Se fosse absorvida, não chegaria aos olhos.", "A folha não produz luz.", "Só a luz absorvida é convertida em energia química.", "Luz não é armazenada pela clorofila."]}, {"id": "b34", "c": "foto", "d": 1, "q": "Clorofila b e carotenoides são chamados de pigmentos acessórios porque:", "a": ["absorvem luz, mas não iniciam as reações", "iniciam as reações sem absorver a luz", "só existem em bactérias fotossintéticas", "refletem toda a luz azul que recebem", "substituem o magnésio da clorofila a"], "k": 0, "e": "Pigmentos ACESSÓRIOS absorvem luz e ampliam a faixa captada, mas quem INICIA as reações é a clorofila a.", "w": [null, "Todo pigmento precisa absorver luz; e não são eles que iniciam as reações.", "Estão em plantas e algas, não só em bactérias.", "A clorofila b absorve principalmente o azul.", "Eles não substituem o magnésio da clorofila a."]}, {"id": "b35", "c": "foto", "d": 1, "q": "Os produtos da etapa fotoquímica utilizados na etapa química (ciclo de Calvin) são:", "a": ["ATP e NADPH", "O₂ e glicose", "CO₂ e água", "ADP e NADP⁺", "amido e O₂"], "k": 0, "e": "A etapa clara produz ATP e NADPH, que fornecem energia e elétrons para o ciclo de Calvin fixar o CO₂.", "w": [null, "O₂ é liberado, e a glicose é PRODUTO da etapa química.", "CO₂ e água são reagentes da fotossíntese.", "ADP e NADP⁺ voltam da etapa química para a clara.", "Amido é reserva feita depois; O₂ é liberado."]}, {"id": "b36", "c": "foto", "d": 1, "q": "A etapa fotoquímica e a etapa química da fotossíntese ocorrem, respectivamente:", "a": ["nos tilacoides e no estroma", "no estroma e nos tilacoides", "nas cristas e na matriz", "no citosol e nos tilacoides", "nos tilacoides e na matriz"], "k": 0, "e": "Etapa fotoquímica (clara): nas membranas dos TILACOIDES, onde estão os fotossistemas. Etapa química (ciclo de Calvin): no ESTROMA.", "w": [null, "A ordem está invertida.", "Cristas e matriz são da mitocôndria.", "A fotossíntese não ocorre no citosol.", "Matriz é da mitocôndria; o ciclo de Calvin é no estroma."]}, {"id": "b37", "c": "foto", "d": 2, "q": "Uma planta foi colocada no escuro. Depois de algum tempo, o ciclo de Calvin também parou. A explicação é que:", "a": ["faltaram ATP e NADPH vindos da etapa clara", "a RuBisCO só funciona quando há luz direta", "o CO₂ do ar só entra na folha quando há luz", "a etapa química acontece só nos tilacoides", "a glicose passou a ser quebrada em O₂ e H₂O"], "k": 0, "e": "O ciclo de Calvin não usa luz diretamente, mas depende do ATP e do NADPH produzidos na etapa fotoquímica. Sem luz, esses produtos acabam e o ciclo para.", "w": [null, "A RuBisCO não precisa de luz direta; o que falta é ATP e NADPH.", "A explicação da apostila é a falta dos produtos da etapa clara.", "A etapa química ocorre no estroma.", "A glicose não é quebrada em O₂ e H₂O."]}, {"id": "b38", "c": "foto", "d": 1, "q": "No ciclo de Calvin, a enzima responsável por fixar o carbono do CO₂ é a:", "a": ["RuBisCO", "catalase", "ATP sintase", "amilase", "helicase"], "k": 0, "e": "A RuBisCO fixa o CO₂ no ciclo de Calvin. Para formar 1 glicose são necessárias 6 voltas, 6 CO₂, 18 ATP e 12 NADPH.", "w": [null, "Catalase decompõe H₂O₂ nos peroxissomos.", "ATP sintase produz ATP; não fixa CO₂.", "Amilase digere amido.", "Helicase abre a dupla-hélice do DNA."]}, {"id": "b39", "c": "foto", "d": 1, "q": "A fotólise da água, que ocorre na etapa fotoquímica, fornece:", "a": ["O₂, elétrons e H⁺", "CO₂, glicose e ATP", "O₂, glicose e CO₂", "ATP, amido e H₂O", "NADP⁺, CO₂ e Mg"], "k": 0, "e": "Na fotólise, a água é quebrada com energia luminosa, liberando O₂, ELÉTRONS (que repõem os da clorofila) e H⁺.", "w": [null, "CO₂ não é produzido, e glicose é feita na etapa química.", "Glicose e CO₂ não saem da quebra da água.", "Amido não é produto da fotólise.", "NADP⁺, CO₂ e magnésio não vêm da água."]}, {"id": "b40", "c": "nuc", "d": 2, "q": "As subunidades dos ribossomos são montadas no núcleo e precisam chegar ao citoplasma. Elas atravessam o envelope nuclear:", "a": ["pelos poros, controlados pelo complexo do poro", "por difusão simples através da bicamada lipídica", "por vesículas formadas pelo complexo golgiense", "pelo espaço perinuclear, que se abre na mitose", "pela lâmina nuclear, que se desfaz na interfase"], "k": 0, "e": "Macromoléculas (proteínas e RNA, incluindo subunidades ribossômicas) passam pelos POROS, cujo COMPLEXO DO PORO controla entrada e saída.", "w": [null, "Moléculas grandes não atravessam a bicamada por difusão simples.", "O Golgi não transporta material do núcleo ao citoplasma.", "O espaço perinuclear fica entre as membranas; não é uma passagem.", "A lâmina nuclear dá forma ao núcleo e não se desfaz na interfase."]}, {"id": "b41", "c": "nuc", "d": 1, "q": "Uma célula com o nucléolo danificado terá dificuldade principalmente para:", "a": ["produzir RNA ribossômico e ribossomos", "duplicar o DNA na fase S da interfase", "formar as duas membranas do envelope", "digerir as bactérias após a fagocitose", "produzir ATP na matriz da mitocôndria"], "k": 0, "e": "O NUCLÉOLO produz o RNA ribossômico (RNAr), que se une a proteínas e forma as subunidades dos ribossomos.", "w": [null, "A duplicação do DNA não depende do nucléolo.", "O envelope nuclear não é formado pelo nucléolo.", "Fagocitose e digestão dependem de lisossomos.", "ATP na matriz depende da mitocôndria."]}, {"id": "b42", "c": "nuc", "d": 2, "q": "Uma região da cromatina está pouco condensada e seus genes estão sendo transcritos. Essa região corresponde à:", "a": ["eucromatina", "heterocromatina", "lâmina nuclear", "nucleoplasma", "cromátide-irmã"], "k": 0, "e": "EUCROMATINA = pouco condensada, DNA ativo, genes acessíveis às enzimas. Heterocromatina = condensada e com atividade gênica reduzida.", "w": [null, "Heterocromatina é condensada e pouco ativa.", "Lâmina nuclear é uma rede de proteínas, não cromatina.", "Nucleoplasma é a solução aquosa do núcleo, não um tipo de cromatina.", "Cromátide-irmã é uma das cópias de um cromossomo duplicado."]}, {"id": "b43", "c": "nuc", "d": 1, "q": "A ordem CRESCENTE de compactação do material genético é:", "a": ["DNA → nucleossomo → solenoide → cromossomo", "DNA → solenoide → nucleossomo → cromossomo", "nucleossomo → DNA → solenoide → cromossomo", "DNA → cromossomo → solenoide → nucleossomo", "solenoide → DNA → nucleossomo → cromossomo"], "k": 0, "e": "Dupla-hélice → NUCLEOSSOMOS (DNA em 8 histonas) → SOLENOIDE → cromonema → CROMOSSOMO (máximo na metáfase).", "w": [null, "O solenoide é formado PELOS nucleossomos; vem depois.", "O DNA é o nível menos compactado; vem primeiro.", "O cromossomo é o nível mais compactado; vem por último.", "O DNA vem antes de tudo; o solenoide não é o primeiro."]}, {"id": "b44", "c": "nuc", "d": 1, "q": "Um cromossomo duplicado, observado no início da mitose, contém:", "a": ["2 cromátides-irmãs e 2 moléculas de DNA", "2 cromátides-irmãs e 1 molécula de DNA", "1 cromátide e 2 moléculas de DNA unidas", "4 cromátides-irmãs e 4 moléculas de DNA", "2 homólogos e 2 moléculas de RNA unidas"], "k": 0, "e": "O cromossomo duplicado tem 2 CROMÁTIDES-IRMÃS unidas pelo centrômero; cada cromátide é uma molécula de DNA, então são 2 moléculas.", "w": [null, "Cada cromátide tem sua própria molécula de DNA: são duas.", "Duas moléculas de DNA formam duas cromátides, não uma.", "Quatro cromátides seriam um par de homólogos duplicados (tétrade).", "Cromátides são de DNA, e não são homólogos."]}, {"id": "b45", "c": "nuc", "d": 2, "q": "Um cromossomo com o centrômero muito próximo de uma das extremidades, com um braço bem curto e outro longo, é classificado como:", "a": ["acrocêntrico", "metacêntrico", "submetacêntrico", "telocêntrico", "holocêntrico"], "k": 0, "e": "ACROCÊNTRICO: centrômero perto da ponta, um braço muito curto. Metacêntrico: no meio; submetacêntrico: pouco deslocado; telocêntrico: na ponta.", "w": [null, "Metacêntrico tem o centrômero no meio e braços iguais.", "Submetacêntrico tem o centrômero apenas um pouco deslocado.", "Telocêntrico tem o centrômero exatamente na ponta (não existe em humanos).", "Esse termo não descreve um centrômero próximo da ponta."]}, {"id": "b46", "c": "nuc", "d": 2, "q": "As extremidades dos cromossomos, que impedem que eles se grudem entre si e encurtam a cada divisão, são os:", "a": ["telômeros", "centrômeros", "cinetócoros", "nucleossomos", "cromonemas"], "k": 0, "e": "TELÔMEROS são sequências repetitivas nas pontas; replicados pela telomerase, encurtam com as divisões e com o envelhecimento.", "w": [null, "Centrômero é a constrição que une as cromátides.", "Cinetócoros prendem o cromossomo às fibras do fuso.", "Nucleossomos são DNA enrolado em histonas.", "Cromonema é um nível de compactação."]}, {"id": "b47", "c": "nuc", "d": 2, "q": "Os cães têm 78 cromossomos em suas células somáticas. Um espermatozoide de cão e uma célula da pele do filhote terão, respectivamente:", "a": ["39 e 78 cromossomos", "78 e 39 cromossomos", "39 e 39 cromossomos", "78 e 156 cromossomos", "156 e 78 cromossomos"], "k": 0, "e": "O gameta é haploide: 78 ÷ 2 = 39. A célula da pele do filhote é somática e diploide: 39 + 39 = 78.", "w": [null, "O gameta é haploide (39), não diploide.", "A célula da pele é somática e diploide (78).", "O número não dobra a cada geração; a fecundação reconstitui 78.", "O gameta tem metade do número, não o dobro."]}, {"id": "b48", "c": "nuc", "d": 1, "q": "Um óvulo humano normal possui:", "a": ["22 autossomos e um cromossomo X", "22 autossomos e um cromossomo Y", "44 autossomos e dois cromossomos X", "23 autossomos e um cromossomo X", "46 autossomos e nenhum alossomo"], "k": 0, "e": "O óvulo é haploide (n = 23): 22 autossomos + 1 alossomo. Como a mulher é XX, o óvulo sempre leva um X.", "w": [null, "O cromossomo Y só pode vir do espermatozoide.", "44 + XX é o conjunto de uma célula somática feminina.", "São 22 autossomos, totalizando 23 cromossomos com o X.", "O gameta tem 23 cromossomos, incluindo um alossomo."]}, {"id": "b49", "c": "nuc", "d": 2, "q": "Para montar o cariótipo, os cromossomos são observados na metáfase porque nessa fase eles estão:", "a": ["no grau máximo de condensação", "descondensados como cromatina", "envolvidos pelo envelope nuclear", "separados em cromátides-filhas", "duplicando o seu DNA na fase S"], "k": 0, "e": "Na METÁFASE os cromossomos atingem o grau MÁXIMO de condensação, ficando bem visíveis ao microscópio óptico.", "w": [null, "Descondensados (cromatina) eles não são distinguidos individualmente.", "Na metáfase o envelope nuclear já se fragmentou.", "A separação das cromátides ocorre na anáfase.", "A duplicação ocorre na interfase, não na metáfase."]}, {"id": "b50", "c": "ciclo", "d": 1, "q": "A duplicação do DNA e dos centríolos acontece na fase:", "a": ["S", "G1", "G2", "M", "G0"], "k": 0, "e": "Na fase S (síntese) da interfase, o DNA e os centríolos são duplicados; cada cromossomo passa a ter 2 cromátides-irmãs.", "w": [null, "G1 é de crescimento e síntese de proteínas e organelas.", "G2 é a p
